name: Bump SW cache version

on:
  push:
    branches: [main]
    paths-ignore:
      - 'sw.js'  # avoid infinite loop

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update SW cache version to commit hash
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          sed -i "s/const CACHE_NAME = '[^']*'/const CACHE_NAME = 'arrm-shell-${SHORT_SHA}'/" sw.js
          echo "Cache version: arrm-shell-${SHORT_SHA}"

      - name: Commit updated sw.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sw.js
          git diff --cached --quiet || git commit -m "chore: bump SW cache to ${GITHUB_SHA::7}"
          git push
