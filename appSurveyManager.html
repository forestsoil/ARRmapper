const PLANTING_SEASON_START = 6; // June (0-indexed)
const PLANTING_SEASON_END   = 9; // September
const ARRMAP_URL = 'https://forestsoil.github.io/ARRmapper/';

function isPlantingSeason() {
  const m = new Date().getMonth();
  return m >= PLANTING_SEASON_START && m <= PLANTING_SEASON_END;
}

// Convert any image blob to JPEG canvas blob
async function toJpegBlob(blob) {
  return new Promise((res, rej) => {
    const img = new Image();
    const url = URL.createObjectURL(blob);
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
      canvas.getContext('2d').drawImage(img, 0, 0);
      URL.revokeObjectURL(url);
      canvas.toBlob(b => b ? res(b) : rej('toBlob failed'), 'image/jpeg', 0.88);
    };
    img.onerror = rej;
    img.src = url;
  });
}

// Build overlay text lines
function overlayLines() {
  const lat = S.values._gps_lat, lng = S.values._gps_lng;
  const ts  = new Date().toLocaleString('en-IN', { timeZone:'Asia/Kolkata',
    year:'numeric', month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false });
  const coords = lat != null
    ? `${lat>=0?'+':''}${lat.toFixed(6)}, ${lng>=0?'+':''}${lng.toFixed(6)}`
    : 'GPS unavailable';
  const place = [S.values.district_code, S.values.block_circle_code, S.values.gp_name]
    .filter(Boolean).join(' / ') || 'Location not set';
  return [coords, ts + ' IST', place, S.submissionId || ''];
}

// Burn overlay onto JPEG blob
async function burnOverlay(blob, opaque) {
  const img = new Image();
  const url = URL.createObjectURL(blob);
  return new Promise((res, rej) => {
    img.onload = () => {
      // Force landscape
      let w = img.naturalWidth, h = img.naturalHeight;
      if (h > w) { [w, h] = [h, w]; } // rotate if portrait

      const canvas  = document.createElement('canvas');
      canvas.width  = w; canvas.height = h;
      const ctx     = canvas.getContext('2d');

      // Draw image (rotate if needed)
      if (img.naturalHeight > img.naturalWidth) {
        ctx.save();
        ctx.translate(w/2, h/2);
        ctx.rotate(Math.PI/2);
        ctx.drawImage(img, -img.naturalWidth/2, -img.naturalHeight/2);
        ctx.restore();
      } else {
        ctx.drawImage(img, 0, 0);
      }
      URL.revokeObjectURL(url);

      // Overlay box: bottom-right corner, 1/4 width × 1/3 height
      const boxW  = Math.round(w / 4);
      const boxH  = Math.round(h / 3);
      const boxX  = w - boxW;
      const boxY  = h - boxH;
      const lines = overlayLines();
      const fsize = Math.max(9, Math.round(boxH / (lines.length + 2)));

      // Black opaque base (covers existing watermarks)
      ctx.fillStyle = 'rgba(0,0,0,1)';
      ctx.fillRect(boxX, boxY, boxW, boxH);

      // Semi-transparent overlay on top (if camera capture)
      if (!opaque) {
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(boxX, boxY, boxW, boxH);
      }

      // Text
      ctx.fillStyle = '#ffffff';
      ctx.font      = `${fsize}px monospace`;
      ctx.textBaseline = 'top';
      lines.forEach((line, i) => {
        ctx.fillText(line, boxX + 6, boxY + 8 + i * (fsize + 3), boxW - 12);
      });

      canvas.toBlob(b => b ? res(b) : rej('toBlob failed'), 'image/jpeg', 0.88);
    };
    img.onerror = rej;
    img.src = url;
  });
}

// Write EXIF metadata into JPEG blob
async function writeExif(blob) {
  if (!window.piexif) return blob;
  return new Promise((res) => {
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const dataUrl = e.target.result;
        const lat = S.values._gps_lat, lng = S.values._gps_lng;
        const now = new Date();

        const exifObj = { '0th':{}, 'Exif':{}, 'GPS':{} };

        // Timestamp
        const dtStr = now.toISOString().replace('T',' ').slice(0,19);
        exifObj['0th'][piexif.ImageIFD.DateTime]         = dtStr;
        exifObj['Exif'][piexif.ExifIFD.DateTimeOriginal] = dtStr;

        // Description fields
        exifObj['0th'][piexif.ImageIFD.ImageDescription] =
          (S.submissionId || '') + ' | ' + (S.project||'') + ' | ' + (S.values.dbc_id||'');
        exifObj['0th'][piexif.ImageIFD.XPComment] =
          [S.values.district_code, S.values.block_circle_code, S.values.gp_name]
          .filter(Boolean).join(' / ');
        exifObj['0th'][piexif.ImageIFD.DocumentName] = S.submissionId || '';

        // GPS
        if (lat != null && lng != null) {
          const toRat = v => {
            const abs = Math.abs(v);
            const deg = Math.floor(abs);
            const minFull = (abs - deg) * 60;
            const min = Math.floor(minFull);
            const sec = Math.round((minFull - min) * 60 * 100);
            return [[deg,1],[min,1],[sec,100]];
          };
          exifObj['GPS'][piexif.GPSIFD.GPSLatitudeRef]  = lat  >= 0 ? 'N' : 'S';
          exifObj['GPS'][piexif.GPSIFD.GPSLatitude]     = toRat(lat);
          exifObj['GPS'][piexif.GPSIFD.GPSLongitudeRef] = lng >= 0 ? 'E' : 'W';
          exifObj['GPS'][piexif.GPSIFD.GPSLongitude]    = toRat(lng);
          exifObj['GPS'][piexif.GPSIFD.GPSDateStamp]    =
            now.toISOString().slice(0,10).replace(/-/g,':');
        }

        const exifBytes = piexif.dump(exifObj);
        const newDataUrl = piexif.insert(exifBytes, dataUrl);
        // Convert back to blob
        const byteStr = atob(newDataUrl.split(',')[1]);
        const arr = new Uint8Array(byteStr.length);
        for (let i=0; i<byteStr.length; i++) arr[i] = byteStr.charCodeAt(i);
        res(new Blob([arr], { type:'image/jpeg' }));
      } catch(e) { console.warn('EXIF write failed:', e); res(blob); }
    };
    reader.onerror = () => res(blob);
    reader.readAsDataURL(blob);
  });
}

// Full image processing pipeline
async function processPhoto(file, withOverlay, opaque) {
  let blob = file;
  // Convert to JPEG if needed
  if (blob.type !== 'image/jpeg') blob = await toJpegBlob(blob);
  // Burn overlay if requested
  if (withOverlay) blob = await burnOverlay(blob, opaque);
  // Write EXIF
  blob = await writeExif(blob);
  return blob;
}

// OPFS PlantationMapper file picker
async function opfsBrowseLP() {
  try {
    const dir   = await opfsDir(['geojson','VectorTool']);
    const files = [];
    for await (const [name, handle] of dir.entries()) {
      if (handle.kind === 'file' && name.includes('_LP_') &&
          (name.endsWith('.geojson') || name.endsWith('.jpg') || name.endsWith('.jpeg'))) {
        const f = await handle.getFile();
        files.push({ name, size: f.size, ts: f.lastModified, handle });
      }
    }
    return files.sort((a,b) => b.ts - a.ts);
  } catch(e) { return []; }
}

const GRIEVANCE_OPFS_PATH = ['grievances'];

async function syncGrievances() {
  if (!S.online) { toast(t('app.offline','Offline'), 'warn'); return; }
  const url = APP_CONFIG.scriptUrl[S.project];
  if (!url) return;
  try {
    toast(t('app.sync_grievances','Syncing grievances…'), 'info', 5000);
    const res = await fetch(url + '?action=listGrievances&project=' + S.project);
    const data = await res.json();
    if (data.ok && data.grievances) {
      const dir = await opfsDir(GRIEVANCE_OPFS_PATH, true);
      await opfsWrite(dir, (S.project||'all') + '.json',
        new Blob([JSON.stringify(data.grievances)], {type:'application/json'}));
      toast(`✓ ${data.grievances.length} grievances cached`, 'success');
    }
  } catch(e) { toast('Sync failed: ' + e.message, 'error'); }
}

async function loadCachedGrievances() {
  try {
    const dir  = await opfsDir(GRIEVANCE_OPFS_PATH);
    const file = await opfsReadBlob(dir, (S.project||'all') + '.json');
    return JSON.parse(await file.text());
  } catch(e) { return []; }
}

// Grievance lookup widget
async function mkGrievanceLookup(f, fg) {
  const wrap = document.createElement('div');
  wrap.id = 'f_' + f.id;

  // District/Block/GP filters
  const filterRow = document.createElement('div');
  filterRow.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px';

  const distSel = document.createElement('select'); distSel.className='field-select';
  distSel.innerHTML = '<option value="">— District —</option>';
  const dists = SCHEMA.admin_hierarchy[S.project]?.districts || {};
  Object.entries(dists).forEach(([code,d]) => {
    const o = document.createElement('option'); o.value=code;
    o.textContent=`${d.label} (${code})`; distSel.appendChild(o);
  });

  const blockSel = document.createElement('select'); blockSel.className='field-select';
  blockSel.innerHTML = '<option value="">— Block —</option>';

  const gpIn = document.createElement('input');
  gpIn.type='text'; gpIn.className='field-input'; gpIn.placeholder=t('app.grievance_lookup','Search grievances…');

  distSel.onchange = () => {
    const dist = dists[distSel.value];
    blockSel.innerHTML = '<option value="">— Block —</option>';
    if (dist) {
      const l2 = dist.blocks || dist.circles || {};
      Object.entries(l2).forEach(([code,label]) => {
        const o = document.createElement('option'); o.value=code;
        o.textContent=`${label} (${code})`; blockSel.appendChild(o);
      });
    }
    refreshResults();
  };
  blockSel.onchange = refreshResults;
  gpIn.oninput = refreshResults;

  filterRow.appendChild(distSel); filterRow.appendChild(blockSel); filterRow.appendChild(gpIn);

  const resultList = document.createElement('div');
  resultList.style.cssText = 'display:flex;flex-direction:column;gap:6px;margin-top:6px';

  const selectedBox = document.createElement('div');
  selectedBox.style.cssText = 'background:rgba(52,201,122,.1);border:1px solid var(--c-accent2);border-radius:7px;padding:8px 12px;font-size:12px;display:none';

  async function refreshResults() {
    const grievances = await loadCachedGrievances();
    const dd = distSel.value, bb = blockSel.value, gp = gpIn.value.toLowerCase();
    const filtered = grievances.filter(g => {
      if (dd && g.district_code !== dd) return false;
      if (bb && g.block_circle_code !== bb) return false;
      if (gp && !(g.gp_name||'').toLowerCase().includes(gp) &&
                !(g.beneficiary_name||'').toLowerCase().includes(gp)) return false;
      return !g.resolution_date; // open only
    });
    resultList.innerHTML = '';
    if (!filtered.length) {
      resultList.innerHTML = `<div style="font-size:12px;color:var(--c-muted);padding:8px">${t('app.no_grievances','No open grievances found')}</div>`;
      return;
    }
    filtered.slice(0,20).forEach(g => {
      const el = document.createElement('div');
      el.style.cssText = 'background:var(--c-card);border:1px solid var(--c-border);border-radius:7px;padding:8px 12px;cursor:pointer;font-size:12px';
      el.innerHTML = `<strong>${g.submission_id?.slice(0,8)||'?'}</strong> · ${g.beneficiary_name||g.lpc_id||g.dbc_id||'—'} · ${g.grievance_typology||''} · <span style="color:var(--c-muted)">${g.grievance_date||''}</span>`;
      el.onclick = () => {
        S.values[f.id] = g.submission_id;
        S.values.grievance_id_ref = g.submission_id;
        // Pre-fill identity fields
        if (g.lpc_id) S.values.lpc_id = g.lpc_id;
        if (g.dbc_id) S.values.dbc_id = g.dbc_id;
        if (g.beneficiary_name) S.values.beneficiary_name = g.beneficiary_name;
        selectedBox.style.display = 'block';
        selectedBox.innerHTML = `✓ Selected: <strong>${g.submission_id?.slice(0,8)}</strong> — ${g.beneficiary_name||g.lpc_id||''}`;
        resultList.innerHTML = '';
      };
      resultList.appendChild(el);
    });
  }

  // Sync button
  const syncBtn = document.createElement('button');
  syncBtn.type='button'; syncBtn.className='file-btn opfs';
  syncBtn.style.cssText='margin-bottom:8px;width:100%';
  syncBtn.innerHTML = '🔄 ' + t('app.sync_grievances','Sync Grievances from server');
  syncBtn.onclick = async () => { await syncGrievances(); await refreshResults(); };

  wrap.appendChild(syncBtn);
  wrap.appendChild(filterRow);
  wrap.appendChild(selectedBox);
  wrap.appendChild(resultList);

  // Auto-load on render
  setTimeout(refreshResults, 100);
  return wrap;
}

    camBtn.onclick = () => fiCam.click();
    galBtn.onclick = () => fiGal.click();

    const handlePhotos = async (files, fromCamera) => {
      const max = f.max_files || (f.multiple ? 10 : 1);
      const toProcess = Array.from(files).slice(0, max - S.files[f.id].length);
      for (const file of toProcess) {
        const processed = await processPhoto(file, isPhoto, !fromCamera);
        addFileChip(file, processed, f.id, prev, isPhoto, !fromCamera);
      }
    };

    fiCam.onchange = async () => { await handlePhotos(fiCam.files, true);  fiCam.value=''; };
    fiGal.onchange = async () => { await handlePhotos(fiGal.files, false); fiGal.value=''; };

    btnRow.appendChild(camBtn); btnRow.appendChild(galBtn);
    wrap.appendChild(btnRow); wrap.appendChild(fiCam); wrap.appendChild(fiGal);

  } else {
    // Generic file zone for non-photo fields (audio, KML, etc.)
    const zone = document.createElement('div'); zone.className='file-zone';
    zone.innerHTML=`<div class="fz-icon">📎</div><div class="fz-label">${f.multiple?'Tap to add files':'Tap to upload'}</div>`;
    const fi = document.createElement('input'); fi.type='file'; fi.style.display='none';
    if (f.accept) fi.accept=f.accept;
    if (f.multiple) fi.multiple=true;
    zone.onclick=()=>fi.click();
    fi.onchange=()=>{
      const max=f.max_files||(f.multiple?10:1);
      Array.from(fi.files).slice(0,max-S.files[f.id].length).forEach(file=>{
        addFileChip(file, file, f.id, prev, false, false);
      });
      fi.value='';
    };
    wrap.appendChild(zone); wrap.appendChild(fi);
  }

  wrap.appendChild(prev);
  return wrap;
}

// Add file chip to preview + push to S.files
function addFileChip(origFile, processedBlob, fieldId, prevEl, processed, opaque) {
  // Rename processed files to .jpg
  const ext = processed ? 'jpg' : origFile.name.split('.').pop();
  const baseName = origFile.name.replace(/\.[^.]+$/, '');
  const newName = processed ? `${baseName}_stamped.jpg` : origFile.name;

  const finalFile = processed
    ? new File([processedBlob], newName, { type:'image/jpeg' })
    : processedBlob;

  S.files[fieldId].push(finalFile);

  const chip = document.createElement('div'); chip.className='file-chip';
  const nm = newName.length>22 ? newName.slice(0,20)+'…' : newName;
  const icon = processed ? '📸' : '📄';
  chip.innerHTML=`${icon} ${nm} <span class="rm">✕</span>`;
  chip.querySelector('.rm').onclick=()=>{
    S.files[fieldId]=S.files[fieldId].filter(ff=>ff.name!==finalFile.name);
    chip.remove();
  };
  prevEl.appendChild(chip);
}

// Render OPFS LP file list
function renderOpfsList(files, listEl, prevEl, f) {
  listEl.innerHTML = '';
  if (!files.length) {
    listEl.innerHTML='<div style="padding:8px;font-size:12px;color:var(--c-muted)">No PlantationMapper files found</div>';
    return;
  }
  files.slice(0,10).forEach(item => {
    const el = document.createElement('div'); el.className='opfs-item';
    const date = new Date(item.ts).toLocaleString('en-IN');
    el.innerHTML=`<span>🗺</span><span class="opfs-name">${item.name}</span><span class="opfs-date">${date}</span>`;
    el.onclick = async () => {
      const file = await item.handle.getFile();
      // Store blob for upload at submit time
      if (!S._opfsKmlFiles) S._opfsKmlFiles = [];
      S._opfsKmlFiles.push({ name: item.name, blob: file });
      addFileChip(file, file, f.id, prevEl, false, false);
      listEl.classList.remove('open');
      toast('Map attached: ' + item.name, 'success');
    };
    listEl.appendChild(el);
  });
}

// ─── Value shorthand ──────────────────────────────────
function _v(id) { return S.values[id]; }

// ─── Validation ───────────────────────────────────────
function _validate(f, inp) {
  const old = inp.nextSibling;
  if (old?.classList?.contains('field-error')) old.remove();
  inp.classList.remove('err');
  if (f.validation?.min_value !== undefined) {
    const v = parseFloat(inp.value);
    if (!isNaN(v) && v < f.validation.min_value) {
      inp.classList.add('err');
      const e = document.createElement('div'); e.className='field-error';
      e.textContent = f.validation.fail_message || `Min: ${f.validation.min_value}`;
      inp.insertAdjacentElement('afterend', e);
      return false;
    }
  }
  return true;
}

function validateForm() {
  let ok=true, errs=[];
  (S.formDef.sections||[]).forEach(sec=>{
    if (sec.show_if && !evalCond(sec.show_if)) return;
    (sec.fields||[]).forEach(f=>{
      if (!f.required) return;
      if (f.projects && !f.projects.includes(S.project)) return;
      if (f.show_if && !evalCond(f.show_if)) return;
      if (f.type==='auto') return;
      const v = _v(f.id);
      const empty = v===undefined||v===null||v===''||(Array.isArray(v)&&!v.length);
      if (empty) { ok=false; errs.push(lbl(f.label,f.id)); }
    });
  });
  // Grievance: require at least one of lpc_id, dbc_id, beneficiary_name
  if (S.formId === 'grievance' && S.values.grievance_stage === 'registration') {
    if (!S.values.lpc_id && !S.values.dbc_id && !S.values.beneficiary_name) {
      ok = false; errs.push('LPC / DBC / Beneficiary Name (at least one required)');
    }
  }
  return { ok, errs };
}

// ═══════════════════════════════════════════════════════
// FLATTEN VALUES for row submission
// ═══════════════════════════════════════════════════════
function flattenValues(vals) {
  const out = {};
  Object.entries(vals).forEach(([k,v])=>{
    if (v===null||v===undefined) return;
    if (typeof v==='object' && v.sqm!==undefined) {
      out[k+'_sqm']=v.sqm; out[k+'_raw']=v.raw; out[k+'_unit']=v.unit;
    } else if (Array.isArray(v)) {
      out[k]=v.join(',');
    } else if (typeof v==='object') {
      Object.entries(v).forEach(([code,val])=>{
        if (typeof val==='object') {
          out[`${k}_${code}_avail`]=val.avail||'';
          out[`${k}_${code}_stock`]=val.stock||0;
        } else { out[`${k}_${code}`]=val; }
      });
    } else { out[k]=v; }
  });
  return out;
}

// ═══════════════════════════════════════════════════════
// SUBMIT FORM
// ═══════════════════════════════════════════════════════
async function submitForm() {
  const { ok, errs } = validateForm();
  if (!ok) { toast('Required: ' + errs.slice(0,3).join(', '), 'error', 5000); return; }

  const btn = document.getElementById('btn-submit');
  btn.disabled=true; btn.textContent='Preparing…';

  const ts_local = new Date().toISOString();
  const payload  = flattenValues(S.values);

  // Build SHA256
  const hashStr = [
    S.submissionId, ts_local, S.project, S.formId,
    S.values.lpc_id||'', S.values.dbc_id||'', S.userEmail||'',
    Object.entries(payload).map(([k,v])=>`${k}:${v}`).sort().join('|')
  ].join('||');
  const sha = await sha256(hashStr);

  const submission = {
    submission_id: S.submissionId, timestamp_local: ts_local,
    project: S.project, form_id: S.formId,
    lpc_id: S.values.lpc_id||'', dbc_id: S.values.dbc_id||'',
    submitted_by: S.userEmail||'', app_version: APP_CONFIG.version,
    device_info: navigator.userAgent.slice(0,80),
    payload, payload_sha256: sha, audit_status: 'pending_server'
  };

  // 1. Submit JSON row
  btn.textContent='Submitting…';
  let rowOk = false;
  const scriptUrl = APP_CONFIG.scriptUrl[S.project];
  const isBaseline = S.formId === 'baseline';

  if (S.online && scriptUrl) {
    try {
      if (isBaseline) {
        // CORS fetch for baseline — needed to read back generated DBC
        const res = await fetch(scriptUrl, {
          method:'POST',
          headers:{'Content-Type':'text/plain'},
          body: JSON.stringify({ action:'submitSurvey', data: submission })
        });
        const json = await res.json();
        if (json.ok) {
          rowOk = true;
          if (json.dbc) showDBCResult(json.dbc);
        }
      } else {
        // no-cors for all other forms
        await fetch(scriptUrl, {
          method:'POST', mode:'no-cors',
          headers:{'Content-Type':'text/plain'},
          body: JSON.stringify({ action:'submitSurvey', data: submission })
        });
        rowOk = true;
      }
    } catch(e) { console.warn('Submit failed:', e.message); }
  }
  if (!rowOk) {
    await idbPut(IDB_QUEUE, submission);
    await updateQueueBadge();
  }

  // 2. Upload files (user-attached + OPFS KML if selected)
  // Collect any OPFS KML blobs stored during plantation map OPFS pick
  const opfsKmlEntries = S._opfsKmlFiles || [];
  const fileCount = Object.values(S.files).reduce((a,arr)=>a+arr.length,0) + opfsKmlEntries.length;
  if (fileCount > 0) {
    btn.textContent = `Uploading ${fileCount} file(s)…`;
    for (const [fieldId, files] of Object.entries(S.files)) {
      for (const file of files) {
        const ext = file.name.split('.').pop();
        const fname = `${S.submissionId}_${fieldId}_${Date.now()}.${ext}`;
        await uploadFileQueued(fname, file, S.submissionId);
      }
    }
    // Upload OPFS-picked KML/GeoJSON blobs
    for (const { name, blob } of opfsKmlEntries) {
      const fname = `${S.submissionId}_opfs_kml_${Date.now()}_${name}`;
      await uploadFileQueued(fname, blob, S.submissionId);
    }
  }

  // 3. Clean up draft
  await idbDelete(IDB_DRAFTS, S.submissionId);
  await updateQueueBadge();

  toast(rowOk ? '✓ Submitted' : '⚠ Queued (offline)', rowOk?'success':'warn');
  btn.disabled=false; btn.textContent='Submit Survey';
  S.values={}; S.files={}; S._opfsKmlFiles=[]; S.submissionId=null;
  showScreen('screen-forms');
}

// ═══════════════════════════════════════════════════════
// QUEUE SYNC (row submissions)
// ═══════════════════════════════════════════════════════
async function syncQueue() {
  if (!S.online) return;
  const queue = await idbGetAll(IDB_QUEUE);
  let synced=0;
  for (const sub of queue) {
    const url = APP_CONFIG.scriptUrl[sub.project];
    if (!url) continue;
    try {
      await fetch(url, { method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'},
        body: JSON.stringify({ action:'submitSurvey', data: sub }) });
      await idbDelete(IDB_QUEUE, sub.submission_id);
      synced++;
    } catch(e) { break; }
  }
  if (synced) { toast(`✓ ${t('app.submitted','Submitted')} ×${synced}`, 'success'); await updateQueueBadge(); }
  await syncFileOutbox();
}

// Translation lookup — returns translated string or fallback
function t(key, fallback) {
  return (I18N[_lang] && I18N[_lang][key]) || (I18N['en'] && I18N['en'][key]) || fallback || key;
}

// Translate a label definition (string, object with en/hi/bn, or per-stakeholder)
function lbl(def, fallback) {
  if (!def) return fallback || '';
  if (typeof def === 'string') return t(def, def);
  // per-stakeholder labels
  const st = S.values.stakeholder_type;
  if (st && def[st]) {
    const v = def[st];
    if (typeof v === 'object') return v[_lang] || v['en'] || v;
    return v;
  }
  // per-project labels
  if (S.project && def[S.project]) return def[S.project];
  // i18n object
  if (def[_lang]) return def[_lang];
  if (def['en']) return def['en'];
  if (def['default']) return def['default'];
  return fallback || '';
}
