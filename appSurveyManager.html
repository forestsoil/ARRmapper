<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<title>Survey Manager — ARR</title>
<style>
:root {
  --c-bg:#f4f6fa;--c-surface:#ffffff;--c-card:#ffffff;--c-border:#dde1ee;
  --c-accent:#2563eb;--c-accent2:#16a34a;--c-warn:#d97706;--c-danger:#dc2626;
  --c-text:#1e2340;--c-muted:#6b7280;--c-input-bg:#f9fafb;
  --radius:10px;--font:'Segoe UI',system-ui,sans-serif;
  --c-asha1:#2563eb;--c-asha2:#16a34a;--c-arun:#d97706;--c-banani:#7c3aed;
  --c-section-hdr:#f1f5f9;
}
[data-theme="dark"] {
  --c-bg:#0f1117;--c-surface:#1a1d27;--c-card:#21253a;--c-border:#2e3350;
  --c-accent:#4f8ef7;--c-accent2:#34c97a;--c-warn:#f5a623;--c-danger:#e05555;
  --c-text:#e8eaf2;--c-muted:#7a80a0;--c-input-bg:#181c2e;
  --c-asha1:#4f8ef7;--c-asha2:#34c97a;--c-arun:#f5a623;--c-banani:#c97bf5;
  --c-section-hdr:#1a1d27;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--c-bg);color:var(--c-text);font-family:var(--font);font-size:15px}
#app{display:flex;flex-direction:column;height:100%}
#topbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--c-surface);border-bottom:1px solid var(--c-border);flex-shrink:0}
#topbar h1{font-size:15px;font-weight:600;flex:1}
#topbar .ver{font-size:11px;color:var(--c-muted)}
#user-chip{font-size:11px;color:var(--c-muted);background:var(--c-card);border-radius:20px;padding:3px 10px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#main{flex:1;overflow-y:auto;padding:14px}
.screen{display:none}.screen.active{display:block}
.proj-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.proj-btn{border:2px solid var(--c-border);border-radius:var(--radius);background:var(--c-card);padding:18px 12px;cursor:pointer;text-align:center;transition:all .15s;display:flex;flex-direction:column;gap:6px;align-items:center}
.proj-btn:active{transform:scale(.97)}
.proj-btn .proj-code{font-size:22px;font-weight:700}
.proj-btn .proj-label{font-size:11px;color:var(--c-muted)}
.proj-btn[data-proj="ASHA1"]{border-color:var(--c-asha1)}.proj-btn[data-proj="ASHA1"] .proj-code{color:var(--c-asha1)}
.proj-btn[data-proj="ASHA2"]{border-color:var(--c-asha2)}.proj-btn[data-proj="ASHA2"] .proj-code{color:var(--c-asha2)}
.proj-btn[data-proj="ARUN"]{border-color:var(--c-arun)}.proj-btn[data-proj="ARUN"] .proj-code{color:var(--c-arun)}
.proj-btn[data-proj="BANANI"]{border-color:var(--c-banani)}.proj-btn[data-proj="BANANI"] .proj-code{color:var(--c-banani)}
#proj-header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back-btn{background:var(--c-card);border:1px solid var(--c-border);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:13px;color:var(--c-text)}
#proj-header .proj-tag{font-weight:700;font-size:16px}
.form-btn-list{display:flex;flex-direction:column;gap:10px}
.form-btn{background:var(--c-card);border:1px solid var(--c-border);border-radius:var(--radius);padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:border-color .15s}
.form-btn:active{transform:scale(.98)}
.form-btn .form-icon{font-size:22px;width:32px;text-align:center}
.form-btn .form-info{flex:1}
.form-btn .form-name{font-weight:600;font-size:14px}
.form-btn .form-meta{font-size:11px;color:var(--c-muted);margin-top:2px}
.form-btn:hover,.form-btn:active{border-color:var(--c-accent)}
#form-header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
#form-title{font-size:16px;font-weight:700}
#form-body{display:flex;flex-direction:column;gap:18px}
.form-section{background:var(--c-card);border:1px solid var(--c-border);border-radius:var(--radius);overflow:hidden}
.form-section.hidden{display:none}
.section-header{padding:10px 14px;background:var(--c-section-hdr);border-bottom:1px solid var(--c-border);font-size:12px;font-weight:600;color:var(--c-muted);text-transform:uppercase;letter-spacing:.5px}
.section-fields{padding:14px;display:flex;flex-direction:column;gap:14px}
.field-group{display:flex;flex-direction:column;gap:5px}
.field-group.hidden{display:none}
.field-label{font-size:12px;font-weight:600;color:var(--c-muted);display:flex;align-items:center;gap:5px}
.field-label .req{color:var(--c-danger)}
.field-hint{font-size:11px;color:var(--c-muted);font-style:italic}
.field-input,.field-select,.field-textarea{background:var(--c-input-bg);border:1px solid var(--c-border);border-radius:7px;padding:10px 12px;color:var(--c-text);font-size:14px;font-family:var(--font);width:100%;outline:none;transition:border-color .15s}
.field-input:focus,.field-select:focus,.field-textarea:focus{border-color:var(--c-accent)}
.field-textarea{min-height:80px;resize:vertical}
.field-select option{background:var(--c-card)}
.field-auto-chip{display:inline-flex;align-items:center;gap:6px;background:var(--c-input-bg);border:1px solid var(--c-border);border-radius:20px;padding:6px 12px;font-size:12px;color:var(--c-accent2)}
.land-area-wrap{display:flex;flex-direction:column;gap:4px}
.land-area-row{display:flex;gap:8px;align-items:center}
.land-area-row input{flex:1}
.land-area-row select{width:130px}
.land-area-sqm{font-size:11px;color:var(--c-muted)}
.multiselect-grid{display:flex;flex-wrap:wrap;gap:7px}
.ms-chip{background:var(--c-input-bg);border:1px solid var(--c-border);border-radius:20px;padding:5px 12px;font-size:12px;cursor:pointer;transition:all .12s;user-select:none}
.ms-chip.selected{background:var(--c-accent);border-color:var(--c-accent);color:#fff}
.scale-widget{display:flex;gap:6px;flex-wrap:wrap}
.scale-btn{width:36px;height:36px;border-radius:7px;background:var(--c-input-bg);border:1px solid var(--c-border);color:var(--c-text);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;transition:all .12s;font-family:var(--font)}
.scale-btn.selected{background:var(--c-accent);border-color:var(--c-accent)}
.species-grid{display:flex;flex-direction:column;gap:6px}
.species-hdr{display:grid;grid-template-columns:1fr 80px;gap:8px;padding:4px 10px;font-size:11px;color:var(--c-muted)}
.species-row{display:grid;grid-template-columns:1fr 80px;align-items:center;gap:8px;background:var(--c-input-bg);border:1px solid var(--c-border);border-radius:7px;padding:8px 10px}
.species-name{font-size:13px}
.species-sci{font-size:10px;color:var(--c-muted)}
.species-count{width:80px;text-align:right}
.species-total-row{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--c-surface);border:1px solid var(--c-accent2);border-radius:7px;font-weight:600;margin-top:4px}
.nurs-hdr{display:grid;grid-template-columns:1fr 80px 90px;gap:8px;padding:4px 10px;font-size:11px;color:var(--c-muted)}
.nurs-row{display:grid;grid-template-columns:1fr 80px 90px;align-items:center;gap:8px;background:var(--c-input-bg);border:1px solid var(--c-border);border-radius:7px;padding:8px 10px}
.nurs-avail{display:flex;gap:4px}
.avail-btn{flex:1;padding:4px 0;border-radius:5px;border:1px solid var(--c-border);background:var(--c-card);font-size:11px;cursor:pointer;text-align:center;font-family:var(--font)}
.avail-btn.yes.sel{background:var(--c-accent2);border-color:var(--c-accent2);color:#000}
.avail-btn.no.sel{background:var(--c-danger);border-color:var(--c-danger);color:#fff}
.file-zone{border:2px dashed var(--c-border);border-radius:var(--radius);padding:16px;text-align:center;cursor:pointer;transition:border-color .15s;background:var(--c-input-bg)}
.file-zone:hover{border-color:var(--c-accent)}
.file-zone .fz-icon{font-size:24px;margin-bottom:4px}
.file-zone .fz-label{font-size:12px;color:var(--c-muted)}
.file-preview{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.file-chip{display:flex;align-items:center;gap:5px;background:var(--c-card);border:1px solid var(--c-border);border-radius:5px;padding:4px 8px;font-size:11px}
.file-chip .rm{cursor:pointer;color:var(--c-danger);margin-left:3px}
.file-uploading{opacity:.6;font-size:10px;color:var(--c-warn)}
.gps-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--c-accent);cursor:pointer;padding:3px 8px;border:1px solid var(--c-accent);border-radius:20px;margin-top:4px;width:fit-content}
.field-error{color:var(--c-danger);font-size:11px;margin-top:2px}
.field-input.err,.field-select.err{border-color:var(--c-danger)}
.sub-id-box{background:var(--c-input-bg);border:1px dashed var(--c-border);border-radius:7px;padding:8px 12px;font-family:monospace;font-size:11px;color:var(--c-muted);word-break:break-all}
#submit-bar{position:sticky;bottom:0;background:var(--c-surface);border-top:1px solid var(--c-border);padding:12px 14px;display:flex;gap:10px;flex-shrink:0}
#submit-bar.hidden{display:none}
.btn-submit{flex:1;padding:13px;border-radius:var(--radius);background:var(--c-accent);color:#fff;font-size:15px;font-weight:600;border:none;cursor:pointer;font-family:var(--font)}
.btn-draft{padding:13px 18px;border-radius:var(--radius);background:var(--c-card);color:var(--c-text);font-size:13px;border:1px solid var(--c-border);cursor:pointer;font-family:var(--font)}
.btn-submit:disabled{opacity:.5;cursor:not-allowed}
#queue-badge{background:var(--c-warn);color:#000;border-radius:20px;padding:2px 8px;font-size:11px;font-weight:700;display:none}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--c-card);border:1px solid var(--c-border);border-radius:var(--radius);padding:10px 18px;font-size:13px;z-index:999;pointer-events:none;opacity:0;transition:opacity .3s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
#toast.success{border-color:var(--c-accent2);color:var(--c-accent2)}
#toast.error{border-color:var(--c-danger);color:var(--c-danger)}
#toast.warn{border-color:var(--c-warn);color:var(--c-warn)}
#online-dot{width:8px;height:8px;border-radius:50%;background:var(--c-accent2);flex-shrink:0}
#online-dot.offline{background:var(--c-danger)}
.draft-item{background:var(--c-card);border:1px solid var(--c-border);border-radius:var(--radius);padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;margin-bottom:8px}
.draft-item:hover{border-color:var(--c-accent)}
.draft-info{flex:1}
.draft-title{font-size:13px;font-weight:600}
.draft-meta{font-size:11px;color:var(--c-muted);margin-top:2px}
.theme-btn{background:none;border:1px solid var(--c-border);border-radius:20px;padding:3px 10px;cursor:pointer;font-size:12px;color:var(--c-muted);font-family:var(--font)}
.lang-btn{background:none;border:1px solid var(--c-border);border-radius:20px;padding:3px 10px;cursor:pointer;font-size:12px;color:var(--c-accent);font-weight:600;font-family:var(--font)}
.outbox-status{font-size:11px;color:var(--c-warn);margin-top:8px;text-align:center}
.file-btns{display:flex;gap:8px;margin-bottom:8px}
.file-btn{flex:1;padding:10px 8px;border-radius:var(--radius);border:1px solid var(--c-border);background:var(--c-card);color:var(--c-text);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;font-family:var(--font)}
.file-btn:active{transform:scale(.97)}
.file-btn.primary{background:var(--c-accent);border-color:var(--c-accent);color:#fff}
.file-btn.opfs{background:var(--c-surface);border-color:var(--c-accent2);color:var(--c-accent2)}
.file-btn.arrmap{background:var(--c-surface);border-color:var(--c-warn);color:var(--c-warn)}
.opfs-picker{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius);padding:10px;margin-top:6px;display:none}
.opfs-picker.open{display:block}
.opfs-item{padding:8px 10px;border-radius:6px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:8px}
.opfs-item:hover{background:var(--c-card)}
.opfs-item .opfs-name{flex:1;font-weight:600}
.opfs-item .opfs-date{color:var(--c-muted);font-size:11px}
.override-warn{background:rgba(245,166,35,.1);border:1px solid var(--c-warn);border-radius:var(--radius);padding:8px 12px;font-size:12px;color:var(--c-warn);margin-top:6px}
.override-confirm{margin-top:6px;display:flex;gap:8px}
.override-confirm button{flex:1;padding:7px;border-radius:6px;border:1px solid var(--c-border);background:var(--c-card);color:var(--c-text);font-size:12px;cursor:pointer;font-family:var(--font)}
/* Mortality form */
.mort-grid{display:flex;flex-direction:column;gap:0}
.mort-hdr{display:grid;grid-template-columns:1fr 70px 70px 70px;gap:6px;padding:6px 10px;font-size:10px;font-weight:700;color:var(--c-muted);text-transform:uppercase;letter-spacing:.05em;background:var(--c-section-hdr);border:1px solid var(--c-border);border-bottom:none;border-radius:var(--radius) var(--radius) 0 0}
.mort-row{display:grid;grid-template-columns:1fr 70px 70px 70px;gap:6px;align-items:center;padding:7px 10px;border:1px solid var(--c-border);border-top:none;background:var(--c-card)}
.mort-row:last-child{border-radius:0 0 var(--radius) var(--radius)}
.mort-row.zero-plant{opacity:.45}
.mort-spp{font-size:12px;font-weight:600;color:var(--c-text)}
.mort-sci{font-size:10px;color:var(--c-muted)}
.mort-input{width:100%;text-align:center;padding:5px 4px;font-size:13px;font-family:var(--font)}
.mort-alive{font-size:12px;font-weight:700;text-align:center;color:var(--c-accent2)}
.mort-alive.negative{color:var(--c-danger)}
/* Health grid */
.health-grid{display:flex;flex-direction:column;gap:0}
.health-hdr{display:grid;grid-template-columns:1fr repeat(8,28px);gap:4px;padding:6px 10px;font-size:10px;font-weight:700;color:var(--c-muted);text-transform:uppercase;letter-spacing:.05em;background:var(--c-section-hdr);border:1px solid var(--c-border);border-bottom:none;border-radius:var(--radius) var(--radius) 0 0}
.health-row{display:grid;grid-template-columns:1fr repeat(8,28px);gap:4px;align-items:center;padding:6px 10px;border:1px solid var(--c-border);border-top:none;background:var(--c-card)}
.health-row:last-child{border-radius:0 0 var(--radius) var(--radius)}
.health-row.zero-plant{opacity:.45}
.health-spp{font-size:12px;font-weight:600}
.health-btn{width:28px;height:28px;border-radius:5px;background:var(--c-input-bg);border:1px solid var(--c-border);color:var(--c-text);cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;font-family:var(--font);padding:0;transition:all .1s}
.health-btn.sel-1,.health-btn.sel-2{background:#dc2626;border-color:#dc2626;color:#fff}
.health-btn.sel-3,.health-btn.sel-4{background:#f97316;border-color:#f97316;color:#fff}
.health-btn.sel-5,.health-btn.sel-6{background:#eab308;border-color:#eab308;color:#000}
.health-btn.sel-7,.health-btn.sel-8{background:#16a34a;border-color:#16a34a;color:#fff}
/* Plot condition slider */
.plot-cond-wrap{display:flex;flex-direction:column;gap:8px}
.plot-cond-chips{display:flex;gap:6px;flex-wrap:wrap}
.plot-cond-chip{padding:7px 12px;border-radius:7px;background:var(--c-input-bg);border:1px solid var(--c-border);font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font);transition:all .12s}
.plot-cond-chip.sel{background:var(--c-accent2);border-color:var(--c-accent2);color:#fff}
/* Plot size widget */
.plot-size-wrap{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.plot-size-wrap input{width:80px}
.plot-size-label{font-size:12px;color:var(--c-muted)}
.plot-size-area{font-size:11px;color:var(--c-accent2);font-weight:600}
/* Tree specimens widget */
.tree-specimens-wrap{display:flex;flex-direction:column;gap:10px}
.tree-specimen-card{background:var(--c-input-bg);border:1px solid var(--c-border);border-radius:var(--radius);padding:12px 14px;position:relative}
.tree-specimen-hdr{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.tree-specimen-id{font-size:12px;font-weight:700;color:var(--c-accent2);font-family:monospace}
.tree-specimen-rm{background:none;border:none;color:var(--c-danger);cursor:pointer;font-size:16px;margin-left:auto;padding:0 4px;font-family:var(--font)}
.tree-specimen-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tree-specimen-fields .field-group{margin:0}
.tree-specimen-fields .full-width{grid-column:1/-1}
.tree-add-btn{background:var(--c-card);border:1.5px dashed var(--c-accent2);border-radius:var(--radius);padding:12px;text-align:center;cursor:pointer;font-size:13px;color:var(--c-accent2);font-weight:600;font-family:var(--font)}
.tree-add-btn:hover{background:rgba(22,163,74,.06)}
.species-other-wrap{display:flex;gap:8px;align-items:center;margin-top:6px}
.species-other-wrap input{flex:1}
.lpc-result{background:rgba(52,201,122,.12);border:1px solid var(--c-accent2);border-radius:var(--radius);padding:10px 14px;font-size:12px;color:var(--c-accent2);margin-top:6px;display:none}
.lpc-result.show{display:block}
.lpc-result strong{color:var(--c-text)}
</style>
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
</head>
<body>
<div id="app">
  <div id="topbar">
    <a href="index.html" class="back-btn" style="text-decoration:none;font-size:12px;padding:5px 10px;flex-shrink:0">⬅ Suite</a>
    <span id="online-dot"></span>
    <h1 id="topbar-title">Survey Manager</h1>
    <button class="lang-btn" id="lang-btn" onclick="cycleLang()">EN</button>
    <button class="theme-btn" id="theme-btn" onclick="toggleTheme()">🌙</button>
    <span id="queue-badge">0</span>
    <span class="ver">v1 DEV22</span>
    <button id="btn-records" onclick="openRecords()" style="font-size:11px;padding:5px 10px;background:var(--c-accent);border:none;border-radius:var(--radius);color:#fff;font-weight:600;cursor:pointer;flex-shrink:0">📋 Records</button>
    <div id="user-chip">Loading…</div>
  </div>
  <div id="main">
    <div id="screen-projects" class="screen active">
      <p id="proj-select-label" style="font-size:13px;color:var(--c-muted);margin-bottom:14px">Select project to begin a survey</p>
      <div class="proj-grid" id="proj-grid"></div>
      <div id="drafts-section" style="margin-top:20px;display:none">
        <p id="drafts-label" style="font-size:12px;color:var(--c-muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px">Saved Drafts</p>
        <div id="drafts-list"></div>
      </div>
    </div>
    <div id="screen-forms" class="screen">
      <div id="proj-header">
        <button class="back-btn" onclick="showProjects()">← Back</button>
        <span class="proj-tag" id="proj-tag" style="font-weight:700;font-size:16px"></span>
        <span style="font-size:13px;color:var(--c-muted);flex:1" id="proj-full-label"></span>
      </div>
      <div class="form-btn-list" id="form-btn-list"></div>
    </div>
    <div id="screen-form" class="screen">
      <div id="form-header">
        <button class="back-btn" id="form-back-btn">← Back</button>
        <span id="form-title"></span>
      </div>
      <div style="margin-bottom:12px">
        <div style="font-size:11px;color:var(--c-muted);margin-bottom:4px">Submission ID</div>
        <div class="sub-id-box" id="sub-id-display"></div>
      </div>
      <div id="dbc-result-box" style="display:none;background:rgba(52,201,122,.15);border:1px solid var(--c-accent2);border-radius:var(--radius);padding:10px 14px;font-size:13px;color:var(--c-accent2);font-weight:600;margin-bottom:12px;font-family:monospace"></div>
      <div id="form-body"></div>
    </div>

    <div id="screen-records" class="screen">
      <div id="proj-header" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <button class="back-btn" onclick="showScreen('screen-projects')">← Back</button>
        <span style="font-weight:700;font-size:15px">📋 Records</span>
