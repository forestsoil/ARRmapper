<script>
// ── Theme: set data-theme before paint for suite consistency ──────────
(function(){ const t=localStorage.getItem('arr_theme')||'light'; if(t==='dark') document.documentElement.setAttribute('data-theme','dark'); })();

function toggleTheme() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const next = isDark ? 'light' : 'dark';
  if (next === 'dark') document.documentElement.setAttribute('data-theme','dark');
  else document.documentElement.removeAttribute('data-theme');
  localStorage.setItem('arr_theme', next);
  const btn = document.getElementById('theme-toggle-btn');
  if (btn) btn.textContent = next === 'dark' ? '☀️' : '🌙';
}
function initThemeBtn() {
  const btn = document.getElementById('theme-toggle-btn');
  if (btn) btn.textContent = (localStorage.getItem('arr_theme')||'light') === 'dark' ? '☀️' : '🌙';
}
</script>

<script>
// ── ARR Suite Shared Auth — arr_auth.js ──────────────────────────────
// Shared across all applets via localStorage keys:
//   arr_user_email  — Google email or @device fallback
//   arr_user_name   — display name
//   arr_auth_ts     — timestamp of last auth (ms)
// Auth expires after 12 hours; re-login required.
// On expiry or missing auth, applets redirect to index.html?redirect={href}

const ARR_AUTH_EMAIL_KEY = 'arr_user_email';
const ARR_AUTH_NAME_KEY  = 'arr_user_name';
const ARR_AUTH_TS_KEY    = 'arr_auth_ts';
const ARR_AUTH_TTL       = 12 * 60 * 60 * 1000; // 12 hours

function arrAuthGet() {
  const email = localStorage.getItem(ARR_AUTH_EMAIL_KEY);
  const name  = localStorage.getItem(ARR_AUTH_NAME_KEY) || '';
  const ts    = parseInt(localStorage.getItem(ARR_AUTH_TS_KEY) || '0');
  if (!email) return null;
  if (Date.now() - ts > ARR_AUTH_TTL) { arrAuthClear(); return null; }
  return { email, name };
}

function arrAuthSet(email, name) {
  localStorage.setItem(ARR_AUTH_EMAIL_KEY, email);
  localStorage.setItem(ARR_AUTH_NAME_KEY,  name || '');
  localStorage.setItem(ARR_AUTH_TS_KEY,    String(Date.now()));
}

function arrAuthClear() {
  localStorage.removeItem(ARR_AUTH_EMAIL_KEY);
  localStorage.removeItem(ARR_AUTH_NAME_KEY);
  localStorage.removeItem(ARR_AUTH_TS_KEY);
}

// Call on applet load — returns auth object or redirects to launcher
function arrAuthCheck(redirectIfMissing = true) {
  const auth = arrAuthGet();
  if (!auth && redirectIfMissing) {
    const returnUrl = encodeURIComponent(window.location.href);
    window.location.href = './index.html?redirect=' + returnUrl;
    return null;
  }
  return auth;
}

// Render a compact user chip element into a container element
function arrAuthRenderChip(containerId, onSignOut) {
  const auth = arrAuthGet();
  const el   = document.getElementById(containerId);
  if (!el) return;
  if (!auth) { el.textContent = ''; return; }
  const display = auth.name && !auth.email.endsWith('@device') ? auth.name : auth.email;
  el.textContent = display;
  el.title = auth.email;
  el.style.cursor = 'pointer';
  el.onclick = () => {
    if (confirm('Signed in as ' + auth.email + '\n\nSign out?')) {

// ── User folder name: username_domaintag ─────────────────────────────
function makeUserFolder(email) {
  const parts = email.split('@');
  const user   = (parts[0] || '').replace(/[^a-zA-Z0-9._-]/g, '_');
  const domain = parts[1] || '';
  const tag    = APP_CONFIG.domainShort[domain] || domain.split('.')[0].slice(0, 3);
  return user + '_' + tag;
}

// ── Session identity (persisted in IndexedDB) ─────────────────────────
let SESSION = { projectKey: null, userFolder: null, setupDone: false };

const IDB_NAME = 'fieldToolDB', IDB_STORE = 'session', IDB_VER = 4, IDB_OUTBOX = 'outbox';
function idbOpen() {
  return new Promise((res,rej) => {
    const req = indexedDB.open(IDB_NAME, IDB_VER);
    req.onupgradeneeded = e => {
    const db = e.target.result;
    if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
    if (!db.objectStoreNames.contains(IDB_OUTBOX)) {
      const os = db.createObjectStore(IDB_OUTBOX, { keyPath: 'id', autoIncrement: true });
      os.createIndex('status', 'status', { unique: false });
    }
    if (!db.objectStoreNames.contains('deferredJpgs')) {
      db.createObjectStore('deferredJpgs', { keyPath: 'id', autoIncrement: true });
    }
  };
    req.onsuccess = e => res(e.target.result);
    req.onerror   = e => rej(e.target.error);
  });
}
async function idbGet(key) {
  const db = await idbOpen();
  return new Promise((res,rej) => {
    const req = db.transaction(IDB_STORE,'readonly').objectStore(IDB_STORE).get(key);
    req.onsuccess = e => res(e.target.result);
    req.onerror   = e => rej(e.target.error);
  });
}
async function idbSet(key, val) {
  const db = await idbOpen();
  return new Promise((res,rej) => {
    const req = db.transaction(IDB_STORE,'readwrite').objectStore(IDB_STORE).put(val, key);
    req.onsuccess = () => res();
    req.onerror   = e => rej(e.target.error);
  });
}
async function idbClear() {
  const db = await idbOpen();
  return new Promise((res,rej) => {
    const tx = db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).clear();
    tx.oncomplete = () => res();
    tx.onerror    = e => rej(e.target.error);
  });
}

// ── Drive upload via Apps Script ──────────────────────────────────────
async function blobToBase64(blob) {
  return new Promise((res,rej) => {
    const r = new FileReader();
    r.onload  = () => res(r.result.split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(blob);
  });
}

async function pushToDrive(filename, blob, toolFolder) {
  if (!SESSION.setupDone || !SESSION.projectKey) return;
  const scriptUrl = APP_CONFIG.projects[SESSION.projectKey]?.scriptUrl;
  if (!scriptUrl || scriptUrl.startsWith('PLACEHOLDER')) {
    console.warn('Drive push skipped — scriptUrl not configured for', SESSION.projectKey);
    return;
  }
  try {
    const b64 = await blobToBase64(blob);
    // no-cors + text/plain avoids the CORS preflight that blocked Apps
    // Script POSTs. Response is opaque (unreadable) but the script still
    // receives and processes the upload server-side.
    await fetch(scriptUrl, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({
        username: SESSION.userFolder, toolFolder, filename,
        fileData: b64, mimeType: blob.type || 'application/octet-stream',
      }),
    });
    console.log('Drive push sent:', filename);
  } catch (e) { console.error('Drive push failed:', filename, e.message); }
}

// Helper: push multiple {filename, blob} pairs to same toolFolder in parallel
async function pushAllToDrive(files, toolFolder) {
  setStatus('\u2601\ufe0f Syncing to Drive\u2026', '');
  // Sequential (not parallel) — prevents race condition in Apps Script
  // getOrCreateFolder() where simultaneous calls each see no folder yet
  // and create duplicates, splitting files across multiple same-named folders.
  let ok = 0;
  for (const {filename, blob} of files) {
    try { await pushToDrive(filename, blob, toolFolder); ok++; } catch(e) {}
  }
  setStatus('\u2601\ufe0f Drive sync done \u2014 ' + ok + '/' + files.length + ' files', '');
}

// ═══════════════════════════════════════════════════════════════════════
// TOOLTIPS — hover (mouse) or tap-hold (touch) shows the translated label
// for an icon-only button. Tooltip text is looked up from Lang fresh at
// SHOW time (not baked in at page-load), so it's automatically correct
// after a language switch with no separate refresh step needed.
// ═══════════════════════════════════════════════════════════════════════
let _tipEl = null;
function hideIconTip() { if (_tipEl) { _tipEl.remove(); _tipEl = null; } }
function showIconTip(el, text) {
  hideIconTip();
  if (!text) return;
  _tipEl = document.createElement('div');
  _tipEl.className = 'icon-tip';
  _tipEl.textContent = text;
  document.body.appendChild(_tipEl);
  const r = el.getBoundingClientRect();
  _tipEl.style.left = Math.round(r.left + r.width / 2) + 'px';
  _tipEl.style.top = Math.round(r.top - 8) + 'px';
  requestAnimationFrame(() => {
    if (!_tipEl) return;
    const tr = _tipEl.getBoundingClientRect();
    if (tr.left < 4) _tipEl.style.left = Math.round(4 + tr.width / 2) + 'px';
    if (tr.right > innerWidth - 4) _tipEl.style.left = Math.round(innerWidth - 4 - tr.width / 2) + 'px';
    if (tr.top < 4) { _tipEl.style.top = Math.round(r.bottom + 8) + 'px'; _tipEl.style.transform = 'translate(-50%,0)'; }
  });
}

// keyOrFn: a Lang key string (resolved fresh each time), or a function
// returning the text directly (for state-dependent tooltips like "current
// direction: NE").
function attachTip(el, keyOrFn) {
  if (!el) return;
  const getText = () => (typeof keyOrFn === 'function' ? keyOrFn() : Lang[keyOrFn]);
  let touchTimer = null, longPressed = false;
  el.addEventListener('mouseenter', () => showIconTip(el, getText()));
  el.addEventListener('mouseleave', hideIconTip);
  el.addEventListener('touchstart', () => {
    longPressed = false;
    touchTimer = setTimeout(() => {
      longPressed = true;
      showIconTip(el, getText());
      if (navigator.vibrate) try { navigator.vibrate(8); } catch (e) {}
    }, 480);
  }, { passive: true });
  el.addEventListener('touchend', (e) => {
    clearTimeout(touchTimer);
    if (longPressed) { e.preventDefault(); hideIconTip(); longPressed = false; }
  });
  el.addEventListener('touchmove',   () => { clearTimeout(touchTimer); hideIconTip(); });
  el.addEventListener('touchcancel', () => { clearTimeout(touchTimer); hideIconTip(); longPressed = false; });
  el.addEventListener('touchcancel', () => { clearTimeout(touchTimer); hideIconTip(); });
}

// ═══════════════════════════════════════════════════════════════════════
// CALLOUTS — small popovers replacing dropdowns, opened by a normal tap
// (not tap-hold, which is reserved for tooltips) on an indicator/trigger
// button. buildFn(box) populates the callout's content; option buttons are
// responsible for calling closeCallout() themselves after a selection.
// ═══════════════════════════════════════════════════════════════════════
let _calloutEl = null, _calloutBackdrop = null;
function closeCallout() {
  if (_calloutEl) { _calloutEl.remove(); _calloutEl = null; }
  if (_calloutBackdrop) { _calloutBackdrop.remove(); _calloutBackdrop = null; }
}
function openCallout(anchorEl, buildFn) {
  closeCallout();
  hideIconTip();
  _calloutBackdrop = document.createElement('div');
  _calloutBackdrop.className = 'callout-backdrop';
  _calloutBackdrop.onclick = closeCallout;
  document.body.appendChild(_calloutBackdrop);

  _calloutEl = document.createElement('div');
  _calloutEl.className = 'callout';
  buildFn(_calloutEl);
  document.body.appendChild(_calloutEl);

  const r = anchorEl.getBoundingClientRect();
  const cr = _calloutEl.getBoundingClientRect();
  let left = r.left, top = r.bottom + 6;
  if (left + cr.width > innerWidth - 4) left = innerWidth - 4 - cr.width;
  if (top + cr.height > innerHeight - 4) top = r.top - cr.height - 6;
  _calloutEl.style.left = Math.max(4, left) + 'px';
  _calloutEl.style.top = Math.max(4, top) + 'px';
}

function calloutOptBtn(label, selected, onClick, extraClass) {
  const b = document.createElement('button');
  b.className = 'icon-btn callout-opt' + (selected ? ' sel' : '') + (extraClass ? ' ' + extraClass : '');
  b.textContent = label;
  b.onclick = () => { onClick(); closeCallout(); };
  return b;
}

function readableTextColor(hex) {
  const r = 255 - parseInt(hex.slice(1,3),16);
  const g = 255 - parseInt(hex.slice(3,5),16);
  const b = 255 - parseInt(hex.slice(5,7),16);
  const lum = (0.299*r + 0.587*g + 0.114*b)/255;
  return lum > 0.5 ? '#ffffff' : '#000000';
}

// ═══════════════════════════════════════════════════════════════════════
// SCROLL-WHEEL NUMBER PICKER — native CSS scroll-snap (smooth, momentum,
// works naturally with touch/mouse-wheel/trackpad without hand-rolled
// drag physics). Tapping the centered value switches to a direct-entry
// text input for typing an exact number. NOTE: this is a finite list
// (clamped at min/max), not a true infinite-loop wheel — a real seamless
// loop needs list-duplication + scroll-position teleporting, which is a
// meaningfully bigger lift; flagged as a possible follow-up if wanted.
// ═══════════════════════════════════════════════════════════════════════
const ITEM_H = 18;

function buildWheelPicker(container, opts) {
  // opts: {min, max, step, decimals, value, onChange}
  container.innerHTML = '';
  container.classList.add('num-picker');

  const wheel = document.createElement('div'); wheel.className = 'picker-wheel';
  const track = document.createElement('div'); track.className = 'picker-track';
  const mask = document.createElement('div'); mask.className = 'picker-center-mask';

  const values = [];
  for (let v = opts.min; v <= opts.max + 1e-9; v += opts.step) values.push(+v.toFixed(opts.decimals));

  function spacer() { const sp = document.createElement('div'); sp.className = 'picker-item'; sp.style.visibility = 'hidden'; return sp; }
  track.appendChild(spacer());
  values.forEach(v => {
    const item = document.createElement('div');
    item.className = 'picker-item';
    item.textContent = v.toFixed(opts.decimals);
    item.dataset.value = v;
    track.appendChild(item);
  });
  track.appendChild(spacer());

  wheel.appendChild(track);
  container.appendChild(wheel);
  container.appendChild(mask);

  function clampIdx(i) { return Math.max(0, Math.min(values.length - 1, i)); }
  function valueToIdx(v) {
    let best = 0, bestD = Infinity;
    values.forEach((x, i) => { const d = Math.abs(x - v); if (d < bestD) { bestD = d; best = i; } });
    return best;
  }
  function scrollToValue(v, smooth) {
    wheel.scrollTo({ top: clampIdx(valueToIdx(v)) * ITEM_H, behavior: smooth ? 'smooth' : 'auto' });
  }
  function currentIdxFromScroll() { return clampIdx(Math.round(wheel.scrollTop / ITEM_H)); }
  function refreshHighlight() {
    const idx = currentIdxFromScroll();
    track.querySelectorAll('.picker-item[data-value]').forEach((el, i) => {
      el.classList.toggle('current', i === idx);
    });
  }

  let scrollTimer = null;
  wheel.addEventListener('scroll', () => {
    refreshHighlight();
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(() => { opts.onChange(values[currentIdxFromScroll()]); }, 130);
  }, { passive: true });

  // Direct value entry: tap the masked center to type an exact number.
  mask.style.pointerEvents = 'auto';
  mask.style.cursor = 'text';
  mask.addEventListener('click', () => {
    const cur = values[currentIdxFromScroll()];
    const input = document.createElement('input');
    input.type = 'number'; input.value = cur; input.min = opts.min; input.max = opts.max; input.step = opts.step;
    input.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;text-align:center;font-size:13px;padding:0;margin:0;border-radius:6px;z-index:5';
    container.style.position = 'relative';
    container.appendChild(input);
    input.focus(); input.select();
    function commit() {
      let v = parseFloat(input.value);
      if (isNaN(v)) v = cur;
      v = Math.max(opts.min, Math.min(opts.max, v));
      input.remove();
      scrollToValue(v, true);
      opts.onChange(v);
    }
    input.addEventListener('blur', commit);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') input.blur(); });
  });

  scrollToValue(opts.value, false);
  refreshHighlight();
  return { scrollToValue, getValues: () => values };
}

  // Determine active position source

function handleGpsBtnTap() {
  if (APP_MODE === 'files') return;
  if (APP_MODE === 'vec') {
    // Centre map on GPS position
    if (window.vecLastPos) {
      map.setView([window.vecLastPos.lat, window.vecLastPos.lon], Math.max(map.getZoom(), 16));
    }
    return;
  }
  // Plantation / Soil — toggle GPS watch
  if (_nonVecWatchId !== null) {
    // Already running — centre map
    if (_nonVecLastPos) {
      map.setView([_nonVecLastPos.lat, _nonVecLastPos.lon], Math.max(map.getZoom(), 16));
    }
    return;
  }
  // Start GPS watch
  if (!navigator.geolocation) {
    updateSbar(); return;
  }
  _nonVecWatchId = navigator.geolocation.watchPosition(
    pos => {
      _nonVecLastPos = { lat: pos.coords.latitude, lon: pos.coords.longitude, accuracy: pos.coords.accuracy };
      updateGpsBtn();
      updateSbar();
    },
    () => { _nonVecLastPos = null; updateGpsBtn(); updateSbar(); },
    { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 }
  );
  updateSbar();
}

function stopNonVecGps() {
  if (_nonVecWatchId !== null) {
    navigator.geolocation.clearWatch(_nonVecWatchId);
    _nonVecWatchId = null;
  }
  _nonVecLastPos = null;
}

// KML / KMZ LOAD
// ═══════════════════════════════════════════════════════════════════════
async function loadKMLFile(input) {
  const file = input.files[0];
  if (!file) return;
  kmlBaseName = file.name.replace(/\.(kml|kmz)$/i, '');
  let kmlText;
  if (file.name.toLowerCase().endsWith('.kmz')) {
    try {
      const zip = await JSZip.loadAsync(file);
      const kf  = Object.keys(zip.files).find(n=>n.toLowerCase().endsWith('.kml'));
      if (!kf) { setStatus('No KML inside KMZ.','err'); return; }
      kmlText = await zip.files[kf].async('string');
    } catch(e) { setStatus('KMZ error: '+e.message,'err'); return; }
  } else { kmlText = await new Promise((res,rej) => { const r=new FileReader(); r.onload=e=>res(e.target.result); r.onerror=rej; r.readAsText(file,'UTF-8'); }); }
  const doc    = new DOMParser().parseFromString(kmlText,'text/xml');
  const coords = extractPolyCoords(doc);
  if (!coords||coords.length<3) { setStatus('No polygon in KML.','err'); return; }
  boundaryLayer.clearLayers(); gridLayer.clearLayers();
  globalGrid=[]; gridByKey.clear(); usedKeys=new Set(); plotPoly=null;
  const tC = coords.map(([lon,lat])=>[lon,lat]);
  if (tC[0][0]!==tC[tC.length-1][0]||tC[0][1]!==tC[tC.length-1][1]) tC.push(tC[0]);
  try { plotPoly = turf.polygon([tC]); }
  catch(e) { setStatus('Polygon error: '+e.message,'err'); return; }
  const llPoly = L.polygon(coords.map(([lon,lat])=>[lat,lon]),
    {color:'#f97316',weight:2.5,dashArray:'6 4',fillOpacity:0.05,fillColor:'#f97316'});
  llPoly.addTo(boundaryLayer);
  map.fitBounds(llPoly.getBounds(),{padding:[16,16]});
  document.getElementById('grid-info').textContent='';
  setStatus(Lang.s_bnd(kmlBaseName),'');
  input.value='';
}

function extractPolyCoords(doc) {
  const el = doc.querySelector('Polygon coordinates,LinearRing coordinates,coordinates');
  if (!el) return null;
  return el.textContent.trim().split(/\s+/).map(s=>{
    const p=s.split(','); return [parseFloat(p[0]),parseFloat(p[1])];
  }).filter(([lon,lat])=>!isNaN(lon)&&!isNaN(lat));
}

function clearBoundary() {
  boundaryLayer.clearLayers(); gridLayer.clearLayers();
  plotPoly=null; globalGrid=[]; gridByKey.clear(); usedKeys=new Set();
  kmlBaseName='fieldmap';
  document.getElementById('grid-info').textContent='';
  setStatus(Lang.s_bnd_rm,'');
}

// ═══════════════════════════════════════════════════════════════════════
// GLOBAL GRID GENERATION
// Mirrors desktop _generate_cell_grid_fast:
//   xs = origin_lon + col * spacingDeg  (col = 0, 1, 2, …)
//   ys = origin_lat + row * spacingDeg  (row = 0, 1, 2, …)
// Grid origin anchored to bbox SW corner + half-spacing so cells are
// centred and symmetric. Row/col indices kept for sweep sort & adjacency.
// ═══════════════════════════════════════════════════════════════════════
function buildGlobalGrid() {
  if (!plotPoly) { setStatus(Lang.s_no_bnd,'warn'); return; }
  const spacingM = currentSpacing || 3;

  // ── Effective spacing calculation ────────────────────────────────
  // N = floor(Area_m² / spacing²)  — PDD contractual count
  // s_eff = sqrt(Area_m² / N)      — effective spacing that places ≥N points
  // Single analytic step, no iteration, no extra turf calls.
  const areaSqM  = turf.area(plotPoly);
  const N_target = Math.floor(areaSqM / (spacingM * spacingM));
  const sEff     = N_target > 0 ? Math.sqrt(areaSqM / N_target) : spacingM;
  spacingDeg     = sEff / 111320;

  // Store for display
  window._gridEffSpacing = sEff;
  window._gridNTarget    = N_target;

  const bb = turf.bbox(plotPoly);
  setStatus(Lang.s_gen,'');
  setTimeout(() => {
    gridLayer.clearLayers();
    usedKeys = new Set();
    blocks.forEach(b => b.points.forEach(p => usedKeys.add(p.key)));

    const originLon = bb[0] + spacingDeg / 2;
    const originLat = bb[1] + spacingDeg / 2;
    const nCols = Math.ceil((bb[2] - bb[0]) / spacingDeg) + 1;
    const nRows = Math.ceil((bb[3] - bb[1]) / spacingDeg) + 1;

    // Extract plot rings ONCE — avoids one turf.point()+turf call per
    // candidate point (was the main-thread bottleneck stalling tile paint).
    const plotRings = extractRings(plotPoly.geometry || plotPoly);

    const newGrid = [];
    const newMap  = new Map();

    for (let row = 0; row < nRows; row++) {
      const lat = originLat + row * spacingDeg;
      if (lat > bb[3] + spacingDeg) break;
      for (let col = 0; col < nCols; col++) {
        const lon = originLon + col * spacingDeg;
        if (lon > bb[2] + spacingDeg) break;
        if (pointInPolygonsFast(lon, lat, plotRings)) {
          const k = ptKey(lat, lon);
          const pt = { lat, lon, row, col, key: k };
          newGrid.push(pt);
          newMap.set(k, pt);
        }
      }
    }
    globalGrid = newGrid;
    gridByKey  = newMap;

    // Render grid dots (Leaflet canvas renderer — handles large counts)
    const cr = L.canvas();
    newGrid.forEach(({lat, lon, key}) => {
      L.circleMarker([lat, lon], {
        renderer: cr, radius: 2,
        fillColor: usedKeys.has(key) ? '#9ca3af' : '#6ee7b7',
        color: 'transparent', fillOpacity: 0.7, interactive: false,
      }).addTo(gridLayer);
    });

    const free = newGrid.length - usedKeys.size;
    document.getElementById('grid-info').textContent = Lang.s_badge(newGrid.length,free,spacingM);
    setStatus(Lang.s_gen_done(newGrid.length,free),'');
  }, 30);
}

function refreshGridDots() {
  gridLayer.clearLayers();
  const cr = L.canvas();
  globalGrid.forEach(({lat, lon, key}) => {
    L.circleMarker([lat, lon], {

// ═══════════════════════════════════════════════════════════════════════
// SWEEP SORT
// Determines the primary traversal order for point selection.
// Mirrors desktop projection-based ordering but aligned to grid rows/cols
// so the result is always a contiguous band (no scattered cells).
//
//   N : top rows first (row DESC), left→right within row (col ASC)
//   S : bottom rows first (row ASC), left→right
//   E : right cols first (col DESC), top→bottom within col (row DESC)
//   W : left cols first (col ASC), top→bottom
//   NE: anti-diagonal DESC (row+col DESC), then col ASC
//   SW: anti-diagonal ASC (row+col ASC), then col ASC
//   NW: diagonal DESC (row-col DESC), then col ASC
//   SE: diagonal ASC (row-col ASC), then col ASC
// ═══════════════════════════════════════════════════════════════════════
function sweepCmp(dir, a, b) {
  switch (dir) {
    case 'N':  return (b.row - a.row) || (a.col - b.col);
    case 'S':  return (a.row - b.row) || (a.col - b.col);
    case 'E':  return (b.col - a.col) || (b.row - a.row);
    case 'W':  return (a.col - b.col) || (b.row - a.row);
    case 'NE': { const d=(b.row+b.col)-(a.row+a.col); return d||(a.col-b.col); }
    case 'SW': { const d=(a.row+a.col)-(b.row+b.col); return d||(a.col-b.col); }
    case 'NW': { const d=(b.row-b.col)-(a.row-a.col); return d||(a.col-b.col); }
    case 'SE': { const d=(a.row-a.col)-(b.row-b.col); return d||(a.col-b.col); }
    default:   return (b.row - a.row) || (a.col - b.col);
  }
}

// DRAW
// ═══════════════════════════════════════════════════════════════════════
// ═══════════════════════════════════════════════════════════════════════
// PLACE BLOCK
// ═══════════════════════════════════════════════════════════════════════

// ═══════════════════════════════════════════════════════════════════════
// FAST POINT-IN-POLYGON  (replaces per-point turf.booleanPointInPolygon
// calls). turf.point()+turf.booleanPointInPolygon() allocates a fresh
// GeoJSON Feature object and re-walks the polygon's ring structure on
// EVERY call. For a grid of a few thousand points this becomes a long
// synchronous block that starves the event loop — including the Image
// onload callbacks Leaflet uses to paint basemap tiles, so tiles visibly
// stall while the grid is being filtered. Fix: extract the polygon's ring
// coordinates ONCE, then run a tight native ray-casting loop per point
// with zero allocation.
// ═══════════════════════════════════════════════════════════════════════
function extractRings(geom) {
  if (!geom) return [];
  if (geom.type === 'Polygon') return [geom.coordinates];
  if (geom.type === 'MultiPolygon') return geom.coordinates;
  return [];
}

function pointInRing(x, y, ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const xi = ring[i][0], yi = ring[i][1];
    const xj = ring[j][0], yj = ring[j][1];
    const hit = ((yi > y) !== (yj > y)) &&
      (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
    if (hit) inside = !inside;
  }
  return inside;
}

// polygons: pre-extracted via extractRings() — array of [outerRing, hole1, hole2...]
function pointInPolygonsFast(lon, lat, polygons) {
  for (let p = 0; p < polygons.length; p++) {
    const rings = polygons[p];
    if (!rings.length || !pointInRing(lon, lat, rings[0])) continue;
    let inHole = false;
    for (let h = 1; h < rings.length; h++) {
      if (pointInRing(lon, lat, rings[h])) { inHole = true; break; }
    }
    if (!inHole) return true;
  }
  return false;
}

// ═══════════════════════════════════════════════════════════════════════
// SHARED POLYGON-OVERLAP CLIPPER
// Used by both the Plantation Mapper (clip drawn block to plot boundary)
// and the Soil Mapper (clip to plot boundary AND subtract whatever's
// already been placed, guaranteeing no overlap between soil types).
// usedUnionGeom may be null (plantation blocks don't need it — overlap
// there is already prevented by the grid's usedKeys set).
// ═══════════════════════════════════════════════════════════════════════
function clipToPlotThenUsed(drawnPoly, usedUnionGeom) {
  let poly = drawnPoly;
  let pctClipped = 100;
  if (plotPoly) {
    try {
      const cl = turf.intersect(drawnPoly, plotPoly);
      if (!cl || turf.area(cl) < 0.1) /* outside — place as-drawn */
      pctClipped = turf.area(cl) / turf.area(drawnPoly) * 100;
      poly = cl;
    } catch (e) {}
  }
  if (usedUnionGeom) {
    try {
      const diff = turf.difference(poly, usedUnionGeom);
      if (!diff || turf.area(diff) < 0.1) return { poly: null, pctClipped, error: 'overlap' };
      poly = diff;
    } catch (e) {}
  }
  return { poly, pctClipped, error: null };
}

// Shared KML <Polygon> ring writer — used by both buildPolygonKMLString()
// and buildSoilKMLString(). (Previously called but never defined — a real
// bug in v10 that threw at export time; fixed here.)
function polygonXml(ring) {
  const coordStr = ring.map(([lon, lat]) => `${lon},${lat},0`).join(' ');
  return `<Polygon><outerBoundaryIs><LinearRing><coordinates>${coordStr}</coordinates></LinearRing></outerBoundaryIs></Polygon>`;
}

// COMMON POLYLINE DRAW TOOL  —  one mode-aware implementation shared by

// ── Click-based polygon drawing (no L.Draw) ──────────────────────────
let _drawVertices = [];
let _drawLayer = null;

function _drawRedraw() {
  if (_drawLayer) { _drawLayer.clearLayers(); }
  else { _drawLayer = L.layerGroup().addTo(map); }
  const lls = _drawVertices.map(v => [v.lat, v.lng]);
  if (!lls.length) return;
  // Draw polygon fill once we have 3+ vertices, otherwise just a line
  if (lls.length >= 3)
    L.polygon(lls, { color:'#f97316', weight:2, dashArray:'5 4', fillOpacity:.1 }).addTo(_drawLayer);
  else
    L.polyline(lls, { color:'#f97316', weight:2, dashArray:'5 4' }).addTo(_drawLayer);
  // Vertex markers
  lls.forEach((ll, i) => L.circleMarker(ll, {
    radius: i===0?7:4, color:'#fff',
    fillColor: i===0?'#f97316':'#3b82f6', fillOpacity:1, weight:1.5
  }).addTo(_drawLayer));
  // Arm length labels (turf)
  for (let i = 0; i < lls.length - 1; i++) {
    const a = _drawVertices[i], b = _drawVertices[i+1];
    const dist = turf.distance(turf.point([a.lng,a.lat]), turf.point([b.lng,b.lat]), {units:'meters'});
    const mid = [(lls[i][0]+lls[i+1][0])/2, (lls[i][1]+lls[i+1][1])/2];
    const lbl = dist>=1000?(dist/1000).toFixed(2)+'km':Math.round(dist)+'m';
    L.marker(mid,{icon:L.divIcon({className:'',html:`<span style="background:rgba(0,0,0,.65);color:#fff;font-size:9px;padding:1px 4px;border-radius:3px;white-space:nowrap">${lbl}</span>`,iconAnchor:[20,8]}),interactive:false}).addTo(_drawLayer);
  }
  // Closing arm label when polygon
  if (lls.length >= 3) {
    const a=_drawVertices[lls.length-1], b=_drawVertices[0];
    const dist=turf.distance(turf.point([a.lng,a.lat]),turf.point([b.lng,b.lat]),{units:'meters'});
    const mid=[(lls[lls.length-1][0]+lls[0][0])/2,(lls[lls.length-1][1]+lls[0][1])/2];
    L.marker(mid,{icon:L.divIcon({className:'',html:`<span style="background:rgba(249,115,22,.7);color:#fff;font-size:9px;padding:1px 4px;border-radius:3px;white-space:nowrap">${Math.round(dist)}m</span>`,iconAnchor:[20,8]}),interactive:false}).addTo(_drawLayer);
  }
  setStatus(_drawVertices.length + ' vertices — tap to add · ✅ to finish (≥3 needed)', '');
}

function _drawOnClick(e) {
  _drawVertices.push(e.latlng);
  _drawRedraw();
}

function startDrawBlock() {
  if (!plotPoly) { setStatus(Lang.s_no_bnd, 'warn'); return; }
  if (APP_MODE === 'plant') {
    if (!globalGrid.length) { setStatus(Lang.s_no_grid, 'warn'); return; }
    if (!currentSpecies) { setStatus(Lang.s_no_sp, 'warn'); return; }
    if (!currentCount || currentCount < 1) { setStatus(Lang.s_no_cnt, 'warn'); return; }
  } else {
    if (!currentSoilType) { setStatus(Lang.s_no_soil, 'warn'); return; }
  }
  if (isDrawing) return;
  isDrawing = true;
  _drawVertices = [];
  if (_drawLayer) { _drawLayer.clearLayers(); _drawLayer.remove(); _drawLayer = null; }
  document.getElementById(drawBtnId()).classList.add('b-off');
  document.getElementById(finishBtnId()).classList.remove('b-off');
  setStatus('Tap map to add vertices · ✅ to finish', '');
  // Disable click interactivity on placed blocks so taps always place vertices
  map.closePopup();
  if (saplingLayer) saplingLayer.eachLayer(l => { if (l.options) l.options.interactive = false; });
  map.on('click', _drawOnClick);
}

function finishDrawBlock() {
  if (!isDrawing) return;
  if (_drawVertices.length < 3) { setStatus(Lang.s_need4 || 'Need ≥3 vertices', 'warn'); return; }
  map.off('click', _drawOnClick);
  isDrawing = false;
  // Re-enable placed block interactivity
  if (saplingLayer) saplingLayer.eachLayer(l => { if (l.options) l.options.interactive = true; });
  document.getElementById(finishBtnId()).classList.add('b-off');
  document.getElementById(drawBtnId()).classList.remove('b-off');
  if (_drawLayer) { _drawLayer.clearLayers(); _drawLayer.remove(); _drawLayer = null; }
  // Build closed latlngs array matching what placeSoilBlock/placeBlock expect
  // Build [lon,lat] ring, fix geometry, convert back to L.latLng array
  let coords = _drawVertices.map(v => [v.lng, v.lat]);
  coords.push(coords[0]); // close ring
  coords = fixPolygonGeometry(coords); // fix winding + self-intersections
  const latlngs = coords.map(([lng, lat]) => L.latLng(lat, lng));
  if (APP_MODE === 'soil') placeSoilBlock(latlngs);
  else placeBlock(latlngs);
  _drawVertices = [];
}

// ═══════════════════════════════════════════════════════════════════════
// COMMON EXPORTER  —  shared zip/KML/JPG/SHP assembly engine. Both modes
// build a small "spec" object describing what to zip and hand it here,
// instead of each maintaining its own copy of the zip/warnings/download
// boilerplate.
//   spec = {
//     emptyMsg: string shown if nothing to export,
//     kmlFiles: [{ name, build: ()=>string }],
//     screenshots: [{ name, overlayFn, legendEntries, legendTitle }],
//     shpLayers: [{ name, shapeType, geoRecords, fields, dbfRecords }],
//     zipSuffix: string,           // e.g. 'fieldPMAP' or 'soilMap'
//     extraNote: string            // optional, appended to the done message
//   }
// ═══════════════════════════════════════════════════════════════════════
// Build a ZIP blob for one SHP layer (shp+shx+dbf+prj) — used both
// for the local combined ZIP and for individual Drive uploads.
async function buildShpZip(layer) {
  if (!layer.geoRecords.length) return null;
  try {
    const set = buildShapefileSet(layer.shapeType, layer.geoRecords, layer.fields, layer.dbfRecords);
    const z = new JSZip();
    z.file(layer.name + '.shp', set.shp);
    z.file(layer.name + '.shx', set.shx);
    z.file(layer.name + '.dbf', set.dbf);
    z.file(layer.name + '.prj', set.prj);
    return await z.generateAsync({ type: 'blob' });
  } catch (e) { console.error('buildShpZip failed:', layer.name, e); return null; }
}

async function runExportZip(spec) {
  setStatus(Lang.s_exporting, '');
  const zip = new JSZip();
  const warnings = [];

  (spec.kmlFiles || []).forEach(f => {
    try { zip.file(f.name, f.build()); }
    catch (e) { warnings.push(f.name); }
  });

  for (const shot of (spec.screenshots || [])) {
    try {
      const result = await captureFramedScreenshot(shot.overlayFn, shot.legendEntries, shot.legendTitle);
      if (result.blob) {
        zip.file(shot.name, result.blob);
        if (result.noBasemap) warnings.push(`${shot.name} saved WITHOUT basemap (tile export blocked)`);
        else if (result.usedOsmFallback) warnings.push(`${shot.name} used OSM basemap (satellite export blocked)`);
        else if (result.partialBasemap) warnings.push(`${shot.name} basemap partially loaded (${result.tilesOk}/${result.tilesTotal} tiles)`);
      } else warnings.push(shot.name);
    } catch (e) { warnings.push(shot.name); }
  }

  (spec.shpLayers || []).forEach(layer => {
    if (!layer.geoRecords.length) return;
    try {
      const set = buildShapefileSet(layer.shapeType, layer.geoRecords, layer.fields, layer.dbfRecords);
      const folder = zip.folder('shapefiles');
      folder.file(`${layer.name}.shp`, set.shp);
      folder.file(`${layer.name}.shx`, set.shx);
      folder.file(`${layer.name}.dbf`, set.dbf);
      folder.file(`${layer.name}.prj`, set.prj);
    } catch (e) { warnings.push(layer.name + ' SHP'); }
  });

  try {
    const zipBlob = await zip.generateAsync({ type: 'blob' });
    dlBlob(`${kmlBaseName}_${spec.zipSuffix}_export${tsSuffix()}.zip`, zipBlob);
    const note = spec.extraNote || '';
    if (warnings.length) setStatus(`Export done with issues: ${warnings.join(', ')}.${note}`, 'warn');
    else setStatus((Lang.s_export_done ? Lang.s_export_done() : 'Export package ready.') + note, '');
  } catch (e) {
    setStatus('Export failed: ' + e.message, 'err');
  }
}

// ── Load session from IDB on startup ─────────────────────────────────
async function loadSessionFromIDB() {
  // ── Auto-select project from launcher localStorage ────────────────
  const launcherProject = localStorage.getItem('arr_project');
  const auth = arrAuthGet();
  if (launcherProject && auth && APP_CONFIG.projects[launcherProject]) {
    SESSION.projectKey = launcherProject;
    SESSION.userFolder = makeUserFolder(auth.email);
    SESSION.setupDone  = true;
    await idbSet('session', { projectKey: launcherProject, userFolder: SESSION.userFolder });
    setupDismiss();
    outboxUpdateBadge();
    return true;
  }
  // ── Fall back to IDB stored session ──────────────────────────────
  try {
    const stored = await idbGet('session');
    if (stored && stored.projectKey && stored.userFolder) {
      SESSION.projectKey = stored.projectKey;
      SESSION.userFolder = stored.userFolder;
      SESSION.setupDone  = true;
      setupDismiss();
      outboxUpdateBadge();
      return true;
    }
  } catch(e) { console.warn('IDB session load failed:', e); }
  // No stored session — overlay stays, user picks project
  return false;
}


// ═══════════════════════════════════════════════════════════════════════
// OPFS OUTBOX  —  structured local file storage + network-aware upload
//
// Outbox (flat naming):   /outbox/{toolFolder}_{filename}
// Sent   (mirrors Drive): /sent/{toolFolder}/{filename}
//
// Flow:
//   export fires → write blob to OPFS outbox → attempt Drive push
//     success → move to sent/{toolFolder}/  + remove from outbox
//     fail/offline → leave in outbox, show ⚠️ badge, retry on reconnect
// ═══════════════════════════════════════════════════════════════════════

// ── OPFS helpers ─────────────────────────────────────────────────────
async function opfsRoot() {
  return await navigator.storage.getDirectory();
}

async function opfsDir(pathParts, create = true) {
  let dir = await opfsRoot();
  for (const part of pathParts) {
    dir = await dir.getDirectoryHandle(part, { create });
  }
  return dir;
}

async function opfsWrite(dir, filename, blob) {
  const fh  = await dir.getFileHandle(filename, { create: true });
  const w   = await fh.createWritable();
  await w.write(blob);
  await w.close();
}

async function opfsReadBlob(dir, filename) {
  const fh = await dir.getFileHandle(filename);
  return await fh.getFile();   // returns a File (subclass of Blob)
}

async function opfsDelete(dir, filename) {
  try { await dir.removeEntry(filename); } catch(e) {}
}

async function opfsList(dir) {
  const names = [];
  for await (const [name, handle] of dir.entries()) {
    if (handle.kind === 'file') names.push(name);
  }
  return names;
}

// ── Outbox IDB helpers ────────────────────────────────────────────────
// IDB stores metadata; OPFS stores actual blobs.
async function idbOutboxAdd(item) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const req = db.transaction(IDB_OUTBOX, 'readwrite')
      .objectStore(IDB_OUTBOX).add(item);
    req.onsuccess = e => res(e.target.result);   // returns auto-increment id
    req.onerror   = e => rej(e.target.error);
  });
}
async function idbOutboxGetAll() {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const req = db.transaction(IDB_OUTBOX, 'readonly')
      .objectStore(IDB_OUTBOX).getAll();
    req.onsuccess = e => res(e.target.result);
    req.onerror   = e => rej(e.target.error);
  });
}
async function idbOutboxDelete(id) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const req = db.transaction(IDB_OUTBOX, 'readwrite')
      .objectStore(IDB_OUTBOX).delete(id);
    req.onsuccess = () => res();
    req.onerror   = e => rej(e.target.error);
  });
}

// ── Core outbox operations ────────────────────────────────────────────
async function outboxEnqueue(filename, blob, toolFolder) {
  // Write blob to OPFS outbox (flat — prefixed with toolFolder)
  const outboxFilename = toolFolder + '_' + filename;
  try {
    const dir = await opfsDir(['outbox']);
    await opfsWrite(dir, outboxFilename, blob);
  } catch(e) { console.warn('OPFS write failed:', e.message); }

  // Store metadata in IDB
  return await idbOutboxAdd({
    filename, outboxFilename, toolFolder,
    mimeType: blob.type || 'application/octet-stream',
    projectKey: SESSION.projectKey,
    userFolder: SESSION.userFolder,
    ts: Date.now(),
    status: 'pending',
    retries: 0,
  });
}

async function outboxMarkSent(item) {
  // /sent/ already written at export time — just delete from outbox
  try {
    const outboxDir = await opfsDir(['outbox']);
    await opfsDelete(outboxDir, item.outboxFilename);
  } catch(e) { console.warn('OPFS outbox cleanup:', e.message); }
  await idbOutboxDelete(item.id);
}

// ── Drive push (network-aware) ────────────────────────────────────────
async function doPushToDrive(filename, blob, toolFolder, projectKey, userFolder) {
  const scriptUrl = APP_CONFIG.projects[projectKey]?.scriptUrl;
  if (!scriptUrl || scriptUrl.startsWith('PLACEHOLDER')) return false;
  try {
    const b64 = await blobToBase64(blob);
    await fetch(scriptUrl, {
      method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({
        username: userFolder, toolFolder, filename,
        fileData: b64, mimeType: blob.type || 'application/octet-stream',
      }),
    });
    return true;
  } catch(e) { return false; }
}

// ── Main export upload entry point (replaces old pushToDrive) ────────
async function uploadFile(filename, blob, toolFolder) {
  if (!SESSION.setupDone || !SESSION.projectKey) return;

  // 1. Enqueue to OPFS outbox (always — gives us local persistence)
  const item = { filename, outboxFilename: toolFolder + '_' + filename,
    toolFolder, mimeType: blob.type || 'application/octet-stream',
    projectKey: SESSION.projectKey, userFolder: SESSION.userFolder,
    ts: Date.now(), status: 'pending', retries: 0 };
  const id = await outboxEnqueue(filename, blob, toolFolder);
  item.id = id;

  // 2. Attempt immediate push if online
  if (navigator.onLine) {
    const ok = await doPushToDrive(filename, blob, toolFolder, item.projectKey, item.userFolder);
    if (ok) {
      await outboxMarkSent(item);
      outboxUpdateBadge();
      return;
    }
  }

  // 3. Failed or offline — stays in outbox, badge updated
  outboxUpdateBadge();
}

// ── Batch upload (replaces pushAllToDrive) ────────────────────────────
async function uploadAllFiles(files, toolFolder) {
  const online = navigator.onLine;
  setStatus(online ? '\u2601\ufe0f Syncing to Drive\u2026' : '\u26a0\ufe0f Offline \u2014 queued to outbox', '');

  for (const { filename, blob } of files) {
    await uploadFile(filename, blob, toolFolder);
  }

  const pending = (await idbOutboxGetAll()).length;
  if (pending > 0) {
    setStatus('\u26a0\ufe0f ' + pending + ' file(s) queued \u2014 will upload when online', '');
  } else {
    setStatus('\u2601\ufe0f Drive sync done', '');
  }
  outboxUpdateBadge();
}

// ── Outbox badge ──────────────────────────────────────────────────────
async function outboxUpdateBadge() {
  const badge = document.getElementById('tb-outbox-badge');
  if (!badge) return;
  try {
    const items = await idbOutboxGetAll();
    if (items.length > 0) {
      badge.style.display = ''; badge.style.opacity='1'; badge.style.background='#b45309';
      badge.textContent = '\ud83d\udce4 ' + items.length;
      badge.title = items.length + ' file(s) pending upload';
    } else {
      badge.style.display = 'none';
    }
  } catch(e) {}
}

// ── Retry outbox on network reconnect ────────────────────────────────
async function retryOutbox() {
  if (!SESSION.setupDone) return;
  const items = await idbOutboxGetAll();
  if (!items.length) return;
  setStatus('\u2601\ufe0f Network restored \u2014 uploading ' + items.length + ' queued file(s)\u2026', '');
  let sent = 0;
  for (const item of items) {
    try {
      const outboxDir = await opfsDir(['outbox']);
      const blob = await opfsReadBlob(outboxDir, item.outboxFilename);
      const ok = await doPushToDrive(item.filename, blob, item.toolFolder, item.projectKey, item.userFolder);
      if (ok) { await outboxMarkSent(item); sent++; }
    } catch(e) {}
  }
  outboxUpdateBadge();
  const remaining = (await idbOutboxGetAll()).length;
  setStatus(remaining === 0
    ? '\u2601\ufe0f All queued files uploaded'
    : '\u26a0\ufe0f ' + remaining + ' file(s) still pending', '');
}

window.addEventListener('online',  () => { retryOutbox(); retryDeferredJpgs(); });
window.addEventListener('offline', () => {

  outboxUpdateBadge();
});

// ═══════════════════════════════════════════════════════════════════════
// DEFERRED JPG EXPORT SYSTEM
//
// When the Google Static Maps API fetch fails (no network at export time),
// the JPG capture returns noBasemap:true — a green-background image that
// is useless for field documentation. Instead of uploading a blank image,
// we serialize the map data needed to re-render it and queue a deferred
// export job. When network restores, retryDeferredJpgs() re-runs the
// full capture (new Maps API call) and uploads the real satellite image.
//
// IDB store: 'deferredJpgs' (added in IDB_VER 3)
// Each job stores: tool type, filename(s), serialized plot + overlay data
// ═══════════════════════════════════════════════════════════════════════

async function idbDeferredAdd(job) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const req = db.transaction('deferredJpgs','readwrite')
      .objectStore('deferredJpgs').add(job);
    req.onsuccess = e => res(e.target.result);
    req.onerror   = e => rej(e.target.error);
  });
}
async function idbDeferredGetAll() {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const req = db.transaction('deferredJpgs','readonly')
      .objectStore('deferredJpgs').getAll();
    req.onsuccess = e => res(e.target.result);
    req.onerror   = e => rej(e.target.error);
  });
}
async function idbDeferredDelete(id) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const req = db.transaction('deferredJpgs','readwrite')
      .objectStore('deferredJpgs').delete(id);
    req.onsuccess = () => res();
    req.onerror   = e => rej(e.target.error);
  });
}

// Queue a deferred soil JPG job
async function deferPlantJpgs(filename1, filename2, ts, toolFolder,
    plantLegend, soilLegend, soilGroups) {
  if (!plotPoly) return;
  await idbDeferredAdd({
    tool: 'plant',
    filename: filename1, filename2, ts, toolFolder,
    plantLegendJson: JSON.stringify(plantLegend),
    soilLegendJson:  JSON.stringify(soilLegend),
    soilGroupsJson:  JSON.stringify(soilGroups),
    plotPolyJson:    JSON.stringify(plotPoly),
    blocksJson:      JSON.stringify(blocks.map(b => ({
      species: b.species, color: b.color, areaSqm: b.areaSqm,
      points:  b.points,
    }))),
    projectKey: SESSION.projectKey,
    userFolder:  SESSION.userFolder,
    ts:          Date.now(),
  });
  console.log('Deferred plantation JPGs queued:', filename1, filename2);
}

// Re-run deferred JPG exports when network restores
async function retryDeferredJpgs() {
  if (!SESSION.setupDone) return;
  const jobs = await idbDeferredGetAll();
  if (!jobs.length) return;

  setStatus('\u{1F5BC}\ufe0f Re-exporting ' + jobs.length + ' deferred map image(s)\u2026', '');
  let done = 0;

  // Save current global state (jobs use a different plot boundary)
  const savedPlotPoly = plotPoly;

  for (const job of jobs) {
    try {
      // Restore plot polygon for this job
      plotPoly = JSON.parse(job.plotPolyJson);

      if (job.tool === 'soil') {
        const soilData = JSON.parse(job.soilBlocksJson);
        const legend   = JSON.parse(job.legendJson);
        const result   = await captureFramedScreenshot(
          (ctx, mapRef) => drawSoilBlockOverlay(ctx, mapRef, soilData),
          legend, job.legendTitle);
        if (result.usedStaticMap && result.blob) {
          await uploadFile(job.filename, result.blob, job.toolFolder);
          await idbDeferredDelete(job.id);
          done++;
        }

      } else if (job.tool === 'plant') {
        const blocksData  = JSON.parse(job.blocksJson);
        const soilGroups  = JSON.parse(job.soilGroupsJson);
        const plantLegend = JSON.parse(job.plantLegendJson);
        const soilLegend  = JSON.parse(job.soilLegendJson);

        // Plantation map JPG
        const r1 = await captureFramedScreenshot(
          (ctx, mapRef) => drawPlantationOverlay(ctx, mapRef, blocksData),
          plantLegend, Lang.th_species || 'Species');
        if (r1.usedStaticMap && r1.blob) {
          await uploadFile(job.filename, r1.blob, job.toolFolder);
        }

        // Planted soil map JPG (if soilGroups present)
        let r2ok = true;
        if (soilGroups.length && job.filename2) {
          const r2 = await captureFramedScreenshot(
            (ctx, mapRef) => drawSoilGroupOverlay(ctx, mapRef, soilGroups),
            soilLegend, Lang.th_soiltype || 'Soil type');
          if (r2.usedStaticMap && r2.blob) {
            await uploadFile(job.filename2, r2.blob, job.toolFolder);
          } else { r2ok = false; }
        }

        if (r1.usedStaticMap && r2ok) {
          await idbDeferredDelete(job.id);
          done++;
        }
      }
    } catch(e) {
      console.error('Deferred JPG retry failed:', job.filename, e.message);
    }
  }

  // Restore global plot poly
  plotPoly = savedPlotPoly;

  const remaining = (await idbDeferredGetAll()).length;
  if (remaining === 0) {
    setStatus('\u{1F5BC}\ufe0f All deferred map images exported', '');
  } else {
    setStatus('\u26a0\ufe0f ' + remaining + ' map image(s) still pending — network needed', '');
  }
}

// FILES MODE  —  on-device archive browser + GeoJSON audit trail
//
// OPFS structure:
//   /sent/{toolFolder}/{filename}     ← deletable archive (ZIPs + JPGs)
//   /geojson/{toolFolder}/{filename}  ← permanent read-only GeoJSON audit
//   /outbox/{flat}                    ← transient pending uploads

// ── GeoJSON builders ─────────────────────────────────────────────────
function _auditProps() {
  const auth = arrAuthGet();
  return {
    operator_email: auth ? auth.email : 'unknown',
    operator_name:  auth ? (auth.name || auth.email) : 'unknown',
    project:        SESSION.projectKey || 'unknown',
    captured_ts:    new Date().toISOString(),
  };
}
function buildSpeciesPolygonsGeoJSON() {
  const audit = _auditProps();
  return { type:'FeatureCollection', features: blocks.map(b => ({
    type:'Feature',
    properties:{ species:b.species, color:b.color, areaSqm:b.areaSqm, saplCount:b.points.length, ...audit },
    geometry: b.geom.geometry || b.geom
  }))};
}
function buildSaplingPointsGeoJSON() {
  const audit = _auditProps();
  return { type:'FeatureCollection', features: blocks.flatMap(b =>
    b.points.map(p => ({
      type:'Feature',
      properties:{ species:b.species, color:b.color, ...audit },
      geometry:{ type:'Point', coordinates:[p.lon, p.lat] }
    }))
  )};
}
function buildPlantSoilGeoJSON(soilGroupsData) {
  const audit = _auditProps();
  return { type:'FeatureCollection', features: soilGroupsData.map(g => ({
    type:'Feature',
    properties:{ soilClass:g.soilClass, color:g.color, areaSqm:g.areaSqm, ...audit },
    geometry: g.geom.geometry || g.geom
  }))};
}
function coordsToKMLStr(coords) {
  return coords.map(c => c[0]+','+c[1]+',0').join(' ');
}
function geomToKML(g) {
  if (!g) return '';
  if (g.type === 'Point')
    return '<Point><coordinates>'+g.coordinates[0]+','+g.coordinates[1]+',0</coordinates></Point>';
  if (g.type === 'LineString')
    return '<LineString><tessellate>1</tessellate><coordinates>'+coordsToKMLStr(g.coordinates)+'</coordinates></LineString>';
  if (g.type === 'Polygon')
    return '<Polygon><outerBoundaryIs><LinearRing><coordinates>'+coordsToKMLStr(g.coordinates[0])+'</coordinates></LinearRing></outerBoundaryIs></Polygon>';
  if (g.type === 'MultiPolygon')
    return '<MultiGeometry>'+g.coordinates.map(poly =>
      '<Polygon><outerBoundaryIs><LinearRing><coordinates>'+coordsToKMLStr(poly[0])+'</coordinates></LinearRing></outerBoundaryIs></Polygon>'
    ).join('')+'</MultiGeometry>';
  return '';
}
function geojsonToKML(geojson, name) {
  const placemarks = geojson.features.map(f => {
    const props = Object.entries(f.properties||{}).map(([k,v])=>
      '<Data name="'+k+'"><value>'+v+'</value></Data>').join('');
    return '<Placemark><ExtendedData>'+props+'</ExtendedData>'+geomToKML(f.geometry)+'</Placemark>';
  }).join('\n');
  return '<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>'+name+'</name>\n'+placemarks+'\n</Document></kml>';
}

        list.appendChild(toolHdr);

        files.sort().reverse();
        const sessions = {};
        files.forEach(f => { const m=f.match(/_([0-9]{8}_[0-9]{6})/); const k=m?m[1]:'other'; if(!sessions[k])sessions[k]=[]; sessions[k].push(f); });
        Object.entries(sessions).forEach(([ts, sf]) => {
          const sh = document.createElement('div');
          sh.style.cssText = 'font-size:9px;color:var(--dim);padding:3px 4px 1px;margin-top:2px';
          sh.textContent = ts.replace('_',' ');
          toolBody.appendChild(sh);
          sf.forEach(fname => toolBody.appendChild(filesRowEl(fname, toolName, toolHandle, false)));
        });
      }
      if (!anyFile) {
        const empty = document.createElement('div');
        empty.style.cssText = 'font-size:11px;color:var(--dim);padding:8px 4px';
        empty.textContent = Lang.files_no_saved || 'No saved files yet.';
        list.appendChild(empty);
      }
    }

    // ── GeoJSON audit ──
    if (geojDir) {
      const gjHdr = document.createElement('div');
      gjHdr.style.cssText = 'font-size:10px;font-weight:700;color:var(--leaf);padding:10px 4px 2px;text-transform:uppercase;letter-spacing:.05em;border-top:1px solid #374151;margin-top:8px';
      gjHdr.textContent = Lang.files_geojson_hdr || '📍 GeoJSON audit (read-only)';
      list.appendChild(gjHdr);

      let anyGJ = false;
      for await (const [toolName, toolHandle] of geojDir.entries()) {
        if (toolHandle.kind !== 'directory') continue;
        const files = await opfsList(toolHandle);
        if (!files.length) continue;
        anyGJ = true;
        const toolHdr = document.createElement('div');
        toolHdr.style.cssText = 'font-size:10px;color:var(--dim);padding:4px 4px 2px';
        toolHdr.textContent = toolName;
        list.appendChild(toolHdr);
        files.sort().reverse();
        for (const fname of files) {
          const row = filesRowEl(fname, toolName, toolHandle, true);
          list.appendChild(row);
        }
      }
      if (!anyGJ) {
        const empty = document.createElement('div');
        empty.style.cssText = 'font-size:11px;color:var(--dim);padding:4px';
        empty.textContent = Lang.files_no_geojson || 'No GeoJSON files yet.';
        list.appendChild(empty);
      }
    }
  } catch(e) {
    list.innerHTML = '<div style="font-size:11px;color:var(--red);padding:8px">'+(Lang.files_err_load||'Error loading files: ') + e.message + '</div>';
  }
}

function filesRowEl(fname, toolName, dirHandle, isGeojson) {
  const ext = fname.split('.').pop().toLowerCase();
  const isImg = ext === 'jpg' || ext === 'jpeg' || ext === 'png';
  const isZip = ext === 'zip';
  const isKml = ext === 'kml';
  const isGj  = ext === 'geojson';

  const row = document.createElement('div');
  row.style.cssText = 'background:var(--card);border:1px solid var(--border);border-radius:6px;padding:5px 6px;font-size:10px;color:var(--mid);display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin:2px 0';

  const nameEl = document.createElement('span');
  nameEl.style.cssText = 'flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:9px;color:var(--dim);max-width:140px';
  nameEl.textContent = fname;
  nameEl.title = fname;
  row.appendChild(nameEl);

  const btns = document.createElement('div');
  btns.style.cssText = 'display:flex;gap:3px;flex-shrink:0';

  // View button — for ZIPs (need GeoJSON) + JPGs + GeoJSONs
  if (isZip || isImg || isGj) {
    const vBtn = smallBtn('👁', Lang.files_view || 'View on map');
    vBtn.dataset.fname = fname;
    vBtn.onclick = () => {
      // Toggle: if this file is already displayed, remove it
      if (_filesViewLayer && _filesViewActiveFname === fname) {
        map.removeLayer(_filesViewLayer); _filesViewLayer = null; _filesViewActiveFname = null;
        vBtn.style.background = '#374151'; setStatus('', ''); return;
      }
      _filesViewActiveFname = fname;
      // Reset all other view buttons
      document.querySelectorAll('[data-fname]').forEach(b => b.style.background = '#374151');
      vBtn.style.background = '#0d7377';
      filesViewFile(fname, toolName, dirHandle, isGeojson);
    };
    btns.appendChild(vBtn);
  }

  // → KML button — for ZIPs and GeoJSONs (convert via geojson sidecar)
  if ((isZip || isGj) && !isGeojson) {
    const kBtn = smallBtn('\u{1F4C4}\u2192KML', 'Convert to KML');
    kBtn.textContent = (Lang.files_to_kml||'\u{1F4C4}\u2192KML').length > 6 ? '\u{1F4C4}\u2192KML' : Lang.files_to_kml||'\u{1F4C4}\u2192KML';
    kBtn.style.fontSize = '8px';
    kBtn.onclick = () => filesConvertToKML(fname, toolName);
    btns.appendChild(kBtn);
  }

  // Download button — for GeoJSONs
  if (isGj) {
    const dBtn = smallBtn('⬇', Lang.files_dl_geojson || 'Download GeoJSON');
    dBtn.onclick = () => filesDownload(fname, dirHandle, 'application/geo+json');
    btns.appendChild(dBtn);
  }
  if (isGj) {
    const bndBtn = smallBtn('📌', 'Use as plot boundary');
    bndBtn.style.color='#f59e0b';
    bndBtn.onclick = () => filesLoadAsBoundary(fname, dirHandle);
    btns.appendChild(bndBtn);
  }
  if ((isZip||isImg||isKml||isGj) && navigator.canShare) {
    const shareBtn = smallBtn('📤', 'Share');
    shareBtn.onclick = () => filesShare(fname, dirHandle, isImg?'image/jpeg':isGj?'application/geo+json':isZip?'application/zip':'application/vnd.google-earth.kml+xml');
    btns.appendChild(shareBtn);
  }

  // Delete — only for sent files (not geojson audit)
  if (!isGeojson && (isZip || isImg || isKml)) {
    const delBtn = smallBtn('🗑', Lang.files_delete || 'Delete');
    delBtn.style.color = '#f87171';
    delBtn.onclick = () => filesDelete(fname, toolName, dirHandle, row);
    btns.appendChild(delBtn);
  }

  row.appendChild(btns);
  return row;
}

function smallBtn(icon, title) {
  const b = document.createElement('button');
  b.textContent = icon; b.title = title;
  b.style.cssText = 'background:var(--mint);border:none;border-radius:4px;color:var(--ink);font-size:11px;padding:2px 5px;cursor:pointer;white-space:nowrap';
  return b;
}

async function filesViewFile(fname, toolName, dirHandle, isGeojson) {
  if (hasUnsavedWork()) {
    filesEnterMode(); return;
  }
  try {
    let geojson;
    if (fname.endsWith('.geojson')) {
      const file = await opfsReadBlob(dirHandle, fname);
      geojson = JSON.parse(await file.text());
    } else if (fname.endsWith('.jpg') || fname.endsWith('.jpeg')) {
      // Show JPG in a simple overlay
      const file = await opfsReadBlob(dirHandle, fname);
      const url = URL.createObjectURL(file);
      const img = document.createElement('img');
      img.src = url; img.style.cssText = 'max-width:100%;max-height:80vh;display:block;margin:auto';
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:5000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px';
      overlay.onclick = () => { URL.revokeObjectURL(url); document.body.removeChild(overlay); };
      overlay.appendChild(img);
      const close = document.createElement('div');
      close.textContent = Lang.files_tap_close || 'Tap to close'; close.style.cssText = 'color:var(--dim);font-size:11px;margin-top:8px';
      overlay.appendChild(close);
      document.body.appendChild(overlay);
      return;
    } else if (fname.endsWith('.zip')) {
      // Find matching GeoJSON sidecar in /geojson/toolFolder/
      const gjName = fname.replace(/\.zip$/, '.geojson');
      try {
        const gjDir = await opfsDir(['geojson', toolName], false);
        const gjFile = await opfsReadBlob(gjDir, gjName);
        geojson = JSON.parse(await gjFile.text());
      } catch(e) {
        setStatus(Lang.files_no_sidecar ? Lang.files_no_sidecar(fname) : '\u26a0\ufe0f No GeoJSON found for ' + fname, ''); return;
      }
    }
    if (!geojson) return;

    // Clear existing drawn layers + render on map
    if (_filesViewLayer) { map.removeLayer(_filesViewLayer); _filesViewLayer = null; }
    _filesViewActiveFname = null;
    _filesViewLayer = L.geoJSON(geojson, {
      style: f => ({ color: f.properties?.color || '#3b82f6', weight: 2, fillOpacity: 0.3 }),
      pointToLayer: (f, ll) => L.circleMarker(ll, {
        radius: 5, fillColor: f.properties?.color || '#3b82f6',
        color: '#fff', weight: 1, fillOpacity: 0.9
      }),
      onEachFeature: (f, layer) => {
        if (f.properties) {
          const info = Object.entries(f.properties).map(([k,v]) => k+': '+v).join('<br>');
          layer.bindPopup(info);
        }
      }
    }).addTo(map);
    const bounds = _filesViewLayer.getBounds();
    if (bounds.isValid()) map.fitBounds(bounds, { padding:[20,20] });
    setStatus(Lang.files_viewing ? Lang.files_viewing(fname) : '👁 Viewing ' + fname, '');
    // Show "pin as overlay" option in the layer list
    renderLayerList();
  } catch(e) {
    setStatus((Lang.files_err_view||'Error viewing file: ') + e.message, 'err');
  }
}

async function filesConvertToKML(fname, toolName) {
  const gjName = fname.replace(/\.(zip|geojson)$/, '.geojson');
  try {
    const gjDir  = await opfsDir(['geojson', toolName], false);
    const gjFile = await opfsReadBlob(gjDir, gjName);
    const geojson = JSON.parse(await gjFile.text());
    const kmlName = gjName.replace('.geojson', '.kml');
    const kml = geojsonToKML(geojson, kmlName.replace('.kml',''));
    dlBlob(kmlName, new Blob([kml], { type:'application/vnd.google-earth.kml+xml' }));
    setStatus(Lang.files_kml_done ? Lang.files_kml_done(kmlName) : '\U0001f4c4 KML: ' + kmlName, '');
  } catch(e) {
    setStatus((Lang.files_err_kml||'KML convert failed: ') + e.message, 'err');
  }
}

async function filesLoadAsBoundary(fname, dirHandle) {
  try {
    const file = await opfsReadBlob(dirHandle, fname);
    const gj = JSON.parse(await file.text());
    const feat = gj.features?.find(f=>f.geometry?.type==='Polygon'||f.geometry?.type==='MultiPolygon');
    if (!feat) { setStatus('No polygon found.','err'); return; }
    const coords = feat.geometry.type==='Polygon'?feat.geometry.coordinates[0]:feat.geometry.coordinates[0][0];
    const tC = coords.map(([lon,lat])=>[lon,lat]);
    if (tC[0][0]!==tC[tC.length-1][0]||tC[0][1]!==tC[tC.length-1][1]) tC.push(tC[0]);
    plotPoly = turf.polygon([tC]);
    boundaryLayer.clearLayers(); gridLayer.clearLayers();
    globalGrid=[]; usedKeys=new Set();
    kmlBaseName = fname.replace(/\.geojson$/,'');
    const llPoly = L.polygon(tC.map(([lon,lat])=>[lat,lon]),{color:'#f97316',weight:2.5,dashArray:'6 4',fillOpacity:0.05});
    llPoly.addTo(boundaryLayer);
    map.fitBounds(llPoly.getBounds(),{padding:[16,16]});
    setStatus('Boundary loaded: '+fname,'');
    switchTab(_filesPriorMode || 'plant');
  } catch(e) { setStatus('Failed: '+e.message,'err'); }
}

async function filesShare(fname, dirHandle, mimeType) {
  try {
    const blob = await opfsReadBlob(dirHandle, fname);
    const shareFile = new File([blob], fname, {type:mimeType});
    if (navigator.canShare({files:[shareFile]})) {
      await navigator.share({files:[shareFile], title:fname});
    } else { filesDownload(fname, dirHandle, mimeType); }
  } catch(e) { if (e.name!=='AbortError') setStatus('Share failed: '+e.message,'err'); }
}

async function filesDownload(fname, dirHandle, mimeType) {
  try {
    const file = await opfsReadBlob(dirHandle, fname);
    dlBlob(fname, new Blob([await file.arrayBuffer()], { type: mimeType }));
  } catch(e) {
    setStatus((Lang.files_err_dl||'Download failed: ') + e.message, 'err');
  }
}

async function filesDelete(fname, toolName, dirHandle, rowEl) {
  if (!confirm(Lang.files_delete_confirm ? Lang.files_delete_confirm(fname) : 'Delete ' + fname + '?\n\nThis removes the on-device copy. Drive copy is unaffected.')) return;
  try {
    await opfsDelete(dirHandle, fname);
    rowEl.remove();
    setStatus(Lang.files_deleted ? Lang.files_deleted(fname) : '🗑 Deleted: ' + fname, '');
  } catch(e) {
    setStatus((Lang.files_err_del||'Delete failed: ') + e.message, 'err');
  }
}

// ── Species 3-column grid ─────────────────────────────────────────────
function buildSpeciesGrid() {
  const grid = document.getElementById('species-grid');
  if (!grid) return;
  grid.innerHTML = '';
  Object.keys(SPECIES_COLORS).forEach(key => {
    const color = SPECIES_COLORS[key];
    const enName = capitalize(key.match(/\(([^)]+)\)/)?.[1] || key);
    const hiName = (SP_NAMES[key]?.hi || '').replace(/\s*\([^)]+\)\s*$/, '');
    const bnName = (SP_NAMES[key]?.bn || '').replace(/\s*\([^)]+\)\s*$/, '');
    const localName = (currentLangCode === 'hi' ? (hiName || enName)
                    : currentLangCode === 'bn' ? (bnName || enName)
                    : enName).toUpperCase();
    const textColor = readableTextColor(color);
    const tile = document.createElement('button');
    const isDisabled = !!DISABLED_SPECIES[key];
    tile.className = 'sp-tile' + (currentSpecies === key ? ' sel' : '') + (isDisabled ? ' sp-disabled' : '');
    tile.dataset.spKey = key;
    if (isDisabled) {
      tile.style.cssText = `background:var(--mint);color:var(--dim);border-color:var(--border);cursor:not-allowed;opacity:0.45`;
      tile.title = DISABLED_SPECIES[key];
    } else {
      tile.style.cssText = `background:${color};color:${textColor};border-color:${color}`;
      tile.title = localName;
      tile.onclick = () => { currentSpecies = key; updateSpeciesIndicator(true); };
    }
    tile.textContent = localName;
    grid.appendChild(tile);
  });
}

function updateSpeciesGridSelection() {
  const grid = document.getElementById('species-grid');
  if (!grid) return;
  grid.querySelectorAll('.sp-tile').forEach(t => {
    t.classList.toggle('sel', t.dataset.spKey === currentSpecies);
  });
  const label = document.getElementById('sp-sel-label');
  if (label) {
    const key = currentSpecies;
    const enName = capitalize(key.match(/\(([^)]+)\)/)?.[1] || key);
    const hiName = (SP_NAMES[key]?.hi || '').replace(/\s*\([^)]+\)\s*$/, '');
    const bnName = (SP_NAMES[key]?.bn || '').replace(/\s*\([^)]+\)\s*$/, '');
    label.textContent = currentLangCode === 'hi' ? (hiName || enName)
                      : currentLangCode === 'bn' ? (bnName || enName)
                      : enName;
  }
}

// ── +/- spacing and count ─────────────────────────────────────────────
function adjustSpacing(delta) {
  currentSpacing = Math.max(0.5, Math.min(30, Math.round((currentSpacing + delta) * 10) / 10));
  updatePMDisplays();
}

function adjustCount(delta) {
  currentCount = Math.max(1, Math.min(2000, currentCount + delta));
  updatePMDisplays();
}

function updatePMDisplays() {
  const sv = document.getElementById('spacing-val');
  if (sv) sv.textContent = (currentSpacing || 3).toFixed(1) + 'm';
  const si = document.getElementById('spacing-input');
  if (si && document.activeElement !== si) si.value = (currentSpacing || 3).toFixed(3);
  const cv = document.getElementById('count-val');
  if (cv) cv.textContent = currentCount || 100;
  const ci = document.getElementById('count-input');
  if (ci && document.activeElement !== ci) ci.value = currentCount || 100;
  const ps = document.getElementById('pm-stat-sp');
  if (ps) ps.textContent = (currentSpacing||3).toFixed(1)+'m';
}

// ── Portrait detection + sidebar helpers ──────────────────────────────
function isPortrait() {
  return window.innerWidth <= 600 && window.innerHeight > window.innerWidth;
}

function closeSidebarPortrait() {
  if (!isPortrait()) return;
  document.getElementById('sidebar').classList.add('collapsed');
}

// ── Float draw buttons (portrait only) ───────────────────────────────
function updateFloatDrawButtons() {
  const el = document.getElementById('float-draw-btns');
  if (!el) return;
  // Shown only in portrait AND during active drawing
  if (isPortrait() && isDrawing) {
    el.style.display = 'flex';
  } else {
    el.style.display = 'none';
  }
}

// ── Collapsible summary toggle ────────────────────────────────────────
function toggleSummary(bodyId, headerEl) {
  const body = document.getElementById(bodyId);
  if (!body) return;
  const hidden = body.style.display === 'none';
  body.style.display = hidden ? '' : 'none';
  if (headerEl) headerEl.classList.toggle('collapsed', !hidden);
}

const MAX_OVERLAY_LAYERS = 5;
let overlayLayers = [];   // [{id, name, path, toolFolder, layer, visible}]

// Open the overlay layer picker (called from a button)
async function openLayerPicker() {
  const panel = document.getElementById('layer-picker-panel');
  if (!panel) return;
  panel.style.display = panel.style.display === 'none' ? '' : 'none';
  if (panel.style.display === '') await layerPickerRefresh();
}

async function layerPickerRefresh() {
  const list = document.getElementById('layer-picker-list');
  if (!list) return;
  list.innerHTML = '<div style="font-size:10px;color:var(--dim)">Loading…</div>';
  const items = [];
  const tools = ['VectorTool','PlantationMapper','SoilMapper'];
  for (const tool of tools) {
    try {
      const dir = await opfsDir(['geojson', tool], false);
      const files = await opfsList(dir);
      files.filter(f => f.endsWith('.geojson')).forEach(f => {
        items.push({ path: f, toolFolder: tool, name: f.replace('.geojson','') });
      });
    } catch(e) {}
  }
  if (!items.length) { list.innerHTML = '<div style="font-size:10px;color:var(--dim)">No GeoJSON files found.</div>'; return; }
  list.innerHTML = '';
  items.forEach(item => {
    const alreadyOn = overlayLayers.find(l => l.path === item.path && l.toolFolder === item.toolFolder);
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid #1f2937;font-size:10px;color:var(--mid)';
    const nameEl = document.createElement('span');
    nameEl.style.cssText = 'flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
    nameEl.textContent = item.name;
    nameEl.title = item.toolFolder + '/' + item.name;
    const addBtn = document.createElement('button');
    addBtn.textContent = alreadyOn ? '✓ On' : '+ Add';
    addBtn.style.cssText = 'background:var(--mint);border:none;border-radius:4px;color:var(--ink);font-size:9px;padding:2px 6px;cursor:pointer;flex-shrink:0';
    addBtn.disabled = !!alreadyOn || overlayLayers.length >= MAX_OVERLAY_LAYERS;
    addBtn.onclick = async () => { await addOverlayLayer(item); await layerPickerRefresh(); renderLayerList(); };
    row.appendChild(nameEl);
    row.appendChild(addBtn);
    list.appendChild(row);
  });
}

async function addOverlayLayer(item) {
  if (overlayLayers.length >= MAX_OVERLAY_LAYERS) { setStatus('Max 5 overlay layers.', 'warn'); return; }
  try {
    const dir = await opfsDir(['geojson', item.toolFolder], false);
    const file = await opfsReadBlob(dir, item.path);
    const gj = JSON.parse(await file.text());

    // Viewport filter: skip if bbox doesn't intersect current map view (zoom > 12)
    if (map.getZoom() > 12) {
      try {
        const bounds = turf.bbox(gj);
        const mapB = map.getBounds();
        const intersects = bounds[0] < mapB.getEast() && bounds[2] > mapB.getWest() &&
                           bounds[1] < mapB.getNorth() && bounds[3] > mapB.getSouth();
        if (!intersects) { setStatus('Layer is outside current view area.', 'warn'); return; }
      } catch(e) {}
    }

    const COLORS = ['#f59e0b','#3b82f6','#10b981','#f97316','#8b5cf6'];
    const color = COLORS[overlayLayers.length % COLORS.length];
    const layer = L.geoJSON(gj, {
      style: () => ({ color, weight:2, fillOpacity:0.2 }),
      pointToLayer: (f, ll) => L.circleMarker(ll, { radius:5, fillColor:color, color:'#fff', weight:1, fillOpacity:.9 }),
    }).addTo(map);

    const id = Date.now() + Math.random();
    overlayLayers.push({ id, name: item.name, path: item.path, toolFolder: item.toolFolder, layer, visible: true, color });
    setStatus('Layer added: ' + item.name, '');
  } catch(e) { setStatus('Load failed: ' + e.message, 'err'); }
}

function renderLayerList() {
  const list = document.getElementById('overlay-layer-list');
  if (!list) return;
  list.innerHTML = '';
  if (!overlayLayers.length) { list.style.display = 'none'; return; }
  list.style.display = '';
  overlayLayers.forEach((item, idx) => {
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;align-items:center;gap:5px;padding:4px 6px;background:var(--card);border-radius:5px;margin-bottom:3px;font-size:10px';
    const dot = document.createElement('span');
    dot.style.cssText = `width:10px;height:10px;border-radius:50%;background:${item.color};flex-shrink:0`;
    const name = document.createElement('span');
    name.style.cssText = 'flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mid)';
    name.textContent = item.name; name.title = item.name;
    const visBtn = document.createElement('button');
    visBtn.textContent = item.visible ? '👁' : '👁‍🗨';
    visBtn.style.cssText = 'background:none;border:none;cursor:pointer;font-size:12px;padding:0 2px';
    visBtn.onclick = () => {
      item.visible = !item.visible;
      item.visible ? item.layer.addTo(map) : map.removeLayer(item.layer);
      renderLayerList();
    };
    const delBtn = document.createElement('button');
    delBtn.textContent = '✕';
    delBtn.style.cssText = 'background:none;border:none;cursor:pointer;color:var(--red);font-size:12px;padding:0 2px';
    delBtn.onclick = () => {
      map.removeLayer(item.layer);
      overlayLayers.splice(idx, 1);
      renderLayerList();
    };
    row.appendChild(dot); row.appendChild(name); row.appendChild(visBtn); row.appendChild(delBtn);
    list.appendChild(row);
  });
}
