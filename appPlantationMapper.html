let soilLayer = null;



function placeBlock(latlngs) {
  exportDone = false;
  if (latlngs.length < 4) { setStatus(Lang.s_need4,'warn'); return; }
  const species = currentSpecies;
  if (!species) { setStatus(Lang.s_no_sp,'warn'); return; }
  const target = currentCount||0;
  if (target < 1) { setStatus(Lang.s_no_cnt,'warn'); return; }
  const color = SPECIES_COLORS[species]||'#ffffff';

  // Build and clip polygon
  const coords = latlngs.map(ll=>[ll.lng,ll.lat]);
  if (coords[0][0]!==coords[coords.length-1][0]||coords[0][1]!==coords[coords.length-1][1])
    coords.push(coords[0]);
  let drawnPoly;
  try { drawnPoly = turf.polygon([coords]); } catch(e) { setStatus('Polygon error.','err'); return; }

  // Clip to KML boundary for accurate grid — never reject even if mostly outside
  let blockPoly = drawnPoly;
  let clipWarn = '';
  if (plotPoly) {
    try {
      const pp = (plotPoly.type === 'Feature') ? plotPoly
               : { type:'Feature', properties:{}, geometry: plotPoly.geometry || plotPoly };
      const cl = turf.intersect(drawnPoly, pp);
      if (cl && turf.area(cl) > 0.1) {
        const pct = turf.area(cl) / turf.area(drawnPoly) * 100;
        blockPoly = cl;
        clipWarn = pct < 95 ? Lang.s_clip(pct.toFixed(0)) : '';
      }
    } catch(e) { /* clip failed — use full drawn polygon */ }
  }

  // ── Phase 1: free globalGrid points INSIDE the drawn block ──────────────
  // Native ray-casting against pre-extracted rings — avoids one turf call
  // per grid point (was the main-thread bottleneck stalling tile paint).
  const blockRings = extractRings(blockPoly.geometry || blockPoly);
  const inner = globalGrid.filter(p =>
    !usedKeys.has(p.key) &&
    pointInPolygonsFast(p.lon, p.lat, blockRings)
  );
  inner.sort((a, b) => sweepCmp(currentDir, a, b));

  let selected;
  if (inner.length >= target) {
    // Shrink: take the first `target` in sweep order (compact band)
    selected = inner.slice(0, target);
  } else {
    // Take all inner, then expand via adjacent-frontier
    selected = inner.slice();
  }

  // ── Phase 2: frontier expansion (adjacent-cell-by-adjacent-cell) ────────
  // Only runs if inner < target. Builds a running set of occupied (row,col)
  // pairs and repeatedly finds free globalGrid cells adjacent to that set,
  // sorted by sweep order, taking as many as needed each round.
  if (selected.length < target) {
    const selRC  = new Set(selected.map(p=>`${p.row},${p.col}`));
    const selKey = new Set(selected.map(p=>p.key));

    const adj = (row, col) =>
      selRC.has(`${row-1},${col}`) || selRC.has(`${row+1},${col}`) ||
      selRC.has(`${row},${col-1}`) || selRC.has(`${row},${col+1}`) ||
      selRC.has(`${row-1},${col-1}`) || selRC.has(`${row-1},${col+1}`) ||
      selRC.has(`${row+1},${col-1}`) || selRC.has(`${row+1},${col+1}`);

    // Run up to 200 frontier passes (prevents infinite loop on isolated plots)
    let pass = 0;
    while (selected.length < target && pass++ < 200) {
      const remaining = target - selected.length;

      const frontier = globalGrid.filter(p =>
        !usedKeys.has(p.key) && !selKey.has(p.key) && adj(p.row, p.col)
      );
      if (!frontier.length) break;

      frontier.sort((a, b) => sweepCmp(currentDir, a, b));
      const pick = frontier.slice(0, remaining);
      pick.forEach(p => {
        selected.push(p);
        selKey.add(p.key);
        selRC.add(`${p.row},${p.col}`);
      });
    }
  }

  if (!selected.length) { setStatus(Lang.s_no_free,'warn'); return; }

  // Mark used
  selected.forEach(p => usedKeys.add(p.key));

  // ── Build polygon from actual cell squares (row-strip union) ─────────────
  // Each selected cell = square [lon-s/2, lat-s/2] → [lon+s/2, lat+s/2]
  // Group by row → rectangle per contiguous col-run per row → union all
  // Result matches exactly the placed cells with no convex-hull over-extension.
  const geom = buildCellPolygon(selected, spacingDeg);
  const areaSqm = geom ? Math.round(turf.area(geom)) : 0;

  // Draw outline
  if (geom) {
    const drawGeomOutline = (g) => {
      const rings = g.type === 'Polygon'
        ? [g.coordinates[0]]
        : g.coordinates.map(poly => poly[0]);
      rings.forEach(ring => {
        const ll = ring.map(([lon,lat]) => [lat, lon]);
        L.polygon(ll, {color, weight:1.5, fill:false, dashArray:'4 3'}).addTo(outlineLayer);
      });
    };
    drawGeomOutline(geom.geometry || geom);
  }

  // Render sapling dots
  selected.forEach(({lat,lon}) => {
    L.circleMarker([lat,lon],{radius:5,fillColor:color,color:'#000',weight:0.6,fillOpacity:0.92})
     .bindPopup(`<b>${escXml(species)}</b>`).addTo(saplingLayer);
  });

  blocks.push({species, color, points:selected, geom, areaSqm});
  refreshGridDots();
  updateSummary();

  const placed = selected.length;
  const warn = placed < target ? Lang.s_only(placed,target) : '';
  setStatus(Lang.s_placed(placed,species,clipWarn,warn), placed<target?'warn':'');
}

// ═══════════════════════════════════════════════════════════════════════
// CELL POLYGON BUILDER
// Constructs the exact planted footprint from row-strip rectangles.
// No convex hull — impossible to overlap with another species block
// because usedKeys prevents any grid point being double-allocated.
//
// Steps:
//  1. Group selected cells by row.
//  2. Within each row, find contiguous col runs.
//  3. Each run → a bboxPolygon (strip rectangle).
//  4. Iteratively union all strips → final Turf Feature<Polygon|MultiPolygon>
// ═══════════════════════════════════════════════════════════════════════
function buildCellPolygon(pts, sDeg) {
  if (!pts.length) return null;
  const half = sDeg / 2;

  // Group by row
  const rows = {};
  pts.forEach(p => {
    if (!rows[p.row]) rows[p.row] = [];
    rows[p.row].push(p);
  });

  // Build strip rectangles
  const rects = [];
  Object.values(rows).forEach(rowPts => {
    rowPts.sort((a, b) => a.col - b.col);
    let runStart = rowPts[0], prev = rowPts[0];
    for (let i = 1; i <= rowPts.length; i++) {
      const cur = rowPts[i];
      if (!cur || cur.col > prev.col + 1) {
        // Flush run
        rects.push(turf.bboxPolygon([
          runStart.lon - half, runStart.lat - half,
          prev.lon + half,     prev.lat + half
        ]));
        if (cur) { runStart = cur; }
      }
      prev = cur || prev;
    }
  });

  if (!rects.length) return null;
  // Union all strips
  let poly = rects[0];
  for (let i = 1; i < rects.length; i++) {
    try { poly = turf.union(poly, rects[i]) || poly; } catch(e) {}
  }
  return poly;
}

// ═══════════════════════════════════════════════════════════════════════
// SUMMARY
// ═══════════════════════════════════════════════════════════════════════
function updateSummary() {
  const agg = {};
  blocks.forEach(b => {
    if (!agg[b.species]) agg[b.species]={color:b.color,count:0,area:0};
    agg[b.species].count += b.points.length;
    agg[b.species].area  += b.areaSqm;
  });
  const tbody = document.getElementById('sp-tbody');
  tbody.innerHTML = '';
  let total = 0;
  Object.entries(agg).sort().forEach(([sp,v]) => {
    total += v.count;
    const sn = speciesDisplayName(sp);
    const tr = document.createElement('tr');
    tr.innerHTML = `<td><span class="sdot" style="background:${v.color}"></span>${sn}</td>`
                 + `<td>${v.count}</td><td>${(v.area/10000).toFixed(3)}ha</td>`;
    tbody.appendChild(tr);
  });
  document.getElementById('total-row').textContent = `${Lang.total}: ${total} ${Lang.saplings || ''}`.trim();
}

// UNDO
// ═══════════════════════════════════════════════════════════════════════
function undoLast() {
  if (!blocks.length) { setStatus(Lang.s_no_undo,'warn'); return; }
  const last = blocks.pop();
  last.points.forEach(p => usedKeys.delete(p.key));
  const sl=[]; saplingLayer.eachLayer(l=>sl.push(l));
  sl.slice(-last.points.length).forEach(l=>saplingLayer.removeLayer(l));
  const ol=[]; outlineLayer.eachLayer(l=>ol.push(l));
  if (ol.length) outlineLayer.removeLayer(ol[ol.length-1]);
  refreshGridDots();
  updateSummary();
  setStatus(Lang.s_undo(last.points.length,last.species),'');
}

function clearAll() {
  // Build list of active layers
  const opts = [];
  if (blocks && blocks.length)        opts.push({ key:'placements', label:'Sapling placements (' + blocks.length + ' blocks)' });
  if (soilBlocks && soilBlocks.length) opts.push({ key:'soil', label:'Soil blocks (' + soilBlocks.length + ')' });
  if (kmlBaseName)                     opts.push({ key:'boundary', label:'Boundary: ' + kmlBaseName });
  if (overlayLayers && overlayLayers.length) opts.push({ key:'overlays', label:'Overlay layers (' + overlayLayers.length + ')' });
  if (_filesViewLayer)                 opts.push({ key:'fileview', label:'File view layer' });

  if (!opts.length) { setStatus('Nothing to clear.',''); return; }

  // Build modal
  const modal = document.createElement('div');
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9000;display:flex;align-items:center;justify-content:center';
  const box = document.createElement('div');
  box.style.cssText = 'background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;min-width:240px;max-width:320px;width:90%';
  box.innerHTML = '<div style="font-weight:700;color:var(--ink);margin-bottom:10px">Clear layers</div>';

  const checks = {};
  opts.forEach(o => {
    const row = document.createElement('label');
    row.style.cssText = 'display:flex;align-items:center;gap:8px;color:var(--mid);font-size:12px;margin-bottom:7px;cursor:pointer';
    const cb = document.createElement('input'); cb.type='checkbox'; cb.checked=true; cb.style.accentColor='#3b82f6';
    checks[o.key] = cb;
    row.appendChild(cb); row.appendChild(document.createTextNode(o.label));
    box.appendChild(row);
  });

  const btnRow = document.createElement('div');
  btnRow.style.cssText = 'display:flex;gap:8px;margin-top:14px;justify-content:flex-end';

  const cancelBtn = document.createElement('button');
  cancelBtn.textContent = 'Cancel';
  cancelBtn.style.cssText = 'background:var(--mint);border:none;border-radius:6px;color:var(--mid);font-size:12px;padding:6px 14px;cursor:pointer';
  cancelBtn.onclick = () => document.body.removeChild(modal);

  const clearBtn = document.createElement('button');
  clearBtn.textContent = 'Clear selected';
  clearBtn.style.cssText = 'background:#ef4444;border:none;border-radius:6px;color:#fff;font-size:12px;padding:6px 14px;cursor:pointer';
  clearBtn.onclick = () => {
    if (checks.placements && checks.placements.checked) { blocks=[]; usedKeys=new Set(); saplingLayer.clearLayers(); outlineLayer.clearLayers(); refreshGridDots(); updateSummary(); }
    if (checks.soil && checks.soil.checked) { soilBlocks=[]; if(typeof soilLayer!=='undefined')soilLayer.clearLayers(); if(typeof renderSoilSummary==='function')renderSoilSummary(); }
    if (checks.boundary && checks.boundary.checked) { kmlBaseName=null; kmlLayer.clearLayers(); gridDots.clearLayers(); blocks=[]; usedKeys=new Set(); saplingLayer.clearLayers(); outlineLayer.clearLayers(); refreshGridDots(); updateSummary(); setStatus(Lang.s_init,''); }
    if (checks.overlays && checks.overlays.checked) { overlayLayers.forEach(l=>map.removeLayer(l.layer)); overlayLayers=[]; renderLayerList(); }
    if (checks.fileview && checks.fileview.checked) { if(_filesViewLayer){map.removeLayer(_filesViewLayer);_filesViewLayer=null;} }
    document.body.removeChild(modal);
    setStatus('Cleared.','');
  };

  btnRow.appendChild(cancelBtn); btnRow.appendChild(clearBtn);
  box.appendChild(btnRow); modal.appendChild(box);
  document.body.appendChild(modal);
}

function hexKml(hex) {
  hex = hex.replace('#','');
  if (hex.length===3) hex=hex.split('').map(c=>c+c).join('');
  if (hex.length!==6) return 'ffffffff';
  return `ff${hex.slice(4,6)}${hex.slice(2,4)}${hex.slice(0,2)}`;
}
function escXml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function sid(s){return s.replace(/[^a-zA-Z0-9]/g,'_');}
function dl(name, content) {
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([content],{type:'application/vnd.google-earth.kml+xml'}));
  a.download=name; document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

// ═══════════════════════════════════════════════════════════════════════
// SOIL POLYGON COMPUTATION
// Groups placed blocks by soil class, unions their geometries per class.
// Blocks whose species has no soil mapping are skipped (matches desktop).
// ═══════════════════════════════════════════════════════════════════════
// SCREENSHOT CAPTURE
// Draws current basemap tiles + a custom overlay onto an offscreen canvas,
// adds a fixed north arrow (Leaflet maps here are never rotated, so "up"
// is always true north), and returns a JPEG Blob.
//
// CORS note: tile images must be served with permissive CORS headers for
// canvas export to succeed (toBlob/toDataURL throw a SecurityError on a
// tainted canvas otherwise). Esri's World_Imagery tiles allow this; some
// OSM tile mirrors do not. On failure this returns null and the caller
// continues without that image rather than aborting the whole export.
// ═══════════════════════════════════════════════════════════════════════

// ═══════════════════════════════════════════════════════════════════════
// SCREENSHOT FRAMING  —  3:2 (or 2:3) aligned to the plot's longer axis,
// best-corner legend placement, north arrow in the opposite corner.
// Mirrors the desktop v90 functions rotate_if_tall / extent_with_margin /
// _best_legend_corner, adapted for a live Leaflet capture: instead of
// rotating basemap pixels (matplotlib/contextily-specific), the OUTPUT
// CANVAS itself is swapped to portrait when the plot is tall, so the long
// axis always lands on the long side of the frame — equivalent result,
// no pixel-rotation risk, and the north arrow needs no tilt since nothing
// is ever rotated (north stays straight up).
// ═══════════════════════════════════════════════════════════════════════
function metersPerDegree(lat) {
  const r = lat * Math.PI / 180;
  return { mLon: 111320 * Math.cos(r), mLat: 110540 };
}

function chooseFrameOrientation(geom) {
  // Always landscape 3:2 now — the capture itself rotates to put the
  // plot's longest axis horizontal (see computePlotRotation), so a
  // separate portrait mode is no longer needed.
  return { w: 1500, h: 1000, tall: false };
}

// Mirrors _best_legend_corner: splits the extent into 4 quadrants around
// its center and returns whichever has the LEAST overlap with the plot
// polygon (the visually emptiest corner) — that's where the legend goes.
const OPPOSITE_CORNER = { ul: 'lr', ur: 'll', ll: 'ur', lr: 'ul' };

function cornerXY(corner, w, h, boxW, boxH) {
  const m = 10;
  switch (corner) {
    case 'ul': return [m, m];
    case 'ur': return [w - boxW - m, m];
    case 'll': return [m, h - boxH - m];
    default:   return [w - boxW - m, h - boxH - m]; // lr
  }
}

function drawLegendAtCorner(ctx, w, h, entries, title, corner) {
  if (!entries || !entries.length) return;
  // Box width is measured from the actual text (title + every entry
  // label) instead of a hardcoded guess — the old fixed 165px regularly
  // overflowed into the basemap once labels grew species counts / ha
  // suffixes. Fonts and swatch +30% on top of the earlier +30% bump
  // (still hard to read at the smaller size) — every dimension below is
  // scaled consistently so the box stays proportional, not just the font.
  const pad = 12, sw = 21, rowH = 27;
  const titleFont = 'bold 18px sans-serif', entryFont = '17px sans-serif';
  ctx.save();
  ctx.font = titleFont;
  let maxTextW = ctx.measureText(title).width;
  ctx.font = entryFont;
  entries.forEach(e => { maxTextW = Math.max(maxTextW, ctx.measureText(e.label).width); });
  const boxW = pad * 2 + sw + 8 + maxTextW;
  const boxH = pad * 2 + 23 + entries.length * rowH;
  const [x0, y0] = cornerXY(corner, w, h, boxW, boxH);
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.fillRect(x0, y0, boxW, boxH);
  ctx.strokeStyle = '#888'; ctx.lineWidth = 1; ctx.strokeRect(x0, y0, boxW, boxH);
  ctx.fillStyle = '#111'; ctx.font = titleFont; ctx.textAlign = 'left';
  ctx.fillText(title, x0 + pad, y0 + pad + 17);
  entries.forEach((e, i) => {
    const ry = y0 + pad + 23 + i * rowH + 17;
    ctx.fillStyle = e.color;
    ctx.fillRect(x0 + pad, ry - 16, sw, sw);
    ctx.strokeStyle = '#555'; ctx.strokeRect(x0 + pad, ry - 16, sw, sw);
    ctx.fillStyle = '#111'; ctx.font = entryFont;
    ctx.fillText(e.label, x0 + pad + sw + 8, ry);
  });
  ctx.restore();
}

function drawNorthArrowAtCorner(ctx, w, h, corner, angle) {
  angle = angle || 0; // radians — direction true north points in the (possibly rotated) frame
  const boxSize = 95;   // +30% again from 73 (still hard to read at that size)
  const [bx, by] = cornerXY(corner, w, h, boxSize, boxSize);
  const cx = bx + boxSize / 2, cy = by + boxSize / 2, r = 27;   // +30% again from 21
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.beginPath(); ctx.arc(cx, cy, r + 13, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#333'; ctx.lineWidth = 1; ctx.stroke();
  // The "N" label stays upright and fixed at the bottom of the badge;
  // only the triangle glyph rotates to indicate the actual north bearing.
  ctx.save();
  ctx.translate(cx, cy); ctx.rotate(angle); ctx.translate(-cx, -cy);
  ctx.beginPath();
  ctx.moveTo(cx, cy - r); ctx.lineTo(cx - 10, cy + 10); ctx.lineTo(cx, cy + 1); ctx.lineTo(cx + 10, cy + 10);
  ctx.closePath();
  ctx.fillStyle = '#e94560'; ctx.fill();
  ctx.strokeStyle = '#7a1530'; ctx.lineWidth = 1; ctx.stroke();
  ctx.restore();
  ctx.fillStyle = '#111'; ctx.font = 'bold 18px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('N', cx, cy + r + 30);
  ctx.restore();
}


// ═══════════════════════════════════════════════════════════════════════
// FRAMED SCREENSHOT CAPTURE
// Spins up a TEMPORARY hidden Leaflet map sized exactly to the target
// output dimensions (computed above), lets it fitBounds + load its own
// fresh tiles, then reads those tiles into a canvas. This fixes the v8
// "basemap visible but missing from JPG" bug two ways at once:
//   1. Tiles are explicitly awaited (layer 'load' event) before capture,
//      removing the race where v8 captured before tiles finished loading.
//   2. If the basemap is still missing from the exported JPG (canvas
//      tainted — toBlob/toDataURL throw on cross-origin image data
//      without a matching CORS header from the tile server), the function
//      automatically retries: Esri → OSM (OSM tile servers are confirmed
//      to send Access-Control-Allow-Origin, per OpenStreetMap's own infra
//      config) → vector-only with a warning, rather than silently
//      producing a basemap-less or missing file.
// ═══════════════════════════════════════════════════════════════════════


function canvasToBlobSafe(canvas) {
  return new Promise(resolve => {
    try { canvas.toBlob(b => resolve(b), 'image/jpeg', 0.92); }
    catch (e) { resolve(null); }
  });
}


// ═══════════════════════════════════════════════════════════════════════
// ROTATED CAPTURE — aligns the exported frame to the plot's longest axis
// (minimum-area bounding rectangle via rotating calipers on the convex
// hull), so elongated/diagonal plots fill the 3:2 frame properly instead
// of sitting small inside a north-up box. The basemap tiles are still
// fetched north-up (Leaflet can't rotate tiles natively) into a larger
// intermediate canvas, then composited onto the final canvas with a
// rotation transform; the same rotation is applied to every overlay
// (polygon outline, sapling points, soil blocks, legend corner, north
// arrow) via a small projection proxy so everything stays in registration.
// ═══════════════════════════════════════════════════════════════════════

// Local projection: lon/lat -> meters, with +x=east, +y=south (down).
// This matches Leaflet's container-pixel convention (increasing latitude
// = decreasing pixel Y), so the rotation angle computed here applies
// directly to both the canvas composition AND Leaflet pixel coordinates
// with no sign-convention mismatch later.
function computePlotRotation(geom) {
  // Simplified to match the desktop tool's proven rotate_if_tall(): a
  // clean 90-degree swap when the plot is taller than it is wide, never
  // an arbitrary angle. The earlier rotating-calipers version aligned to
  // the true longest axis at any angle, but for a diagonally-oriented
  // plot that makes the axis-aligned tile-fetch area (which has to
  // contain the rotated rectangle's corners) balloon well beyond the
  // plot itself — exactly the case where tiles started failing to load.
  // A 0/90-only rotation has no such blowup: rotating a rectangle by
  // exactly 90 degrees swaps width/height with zero area inflation.
  const bbox = turf.bbox(geom);
  const cLon = (bbox[0] + bbox[2]) / 2, cLat = (bbox[1] + bbox[3]) / 2;
  const { mLon, mLat } = metersPerDegree(cLat);
  const widthM  = (bbox[2] - bbox[0]) * mLon;
  const heightM = (bbox[3] - bbox[1]) * mLat;
  const rotated = heightM > widthM * 1.2;          // same threshold as rotate_if_tall
  const R = rotated ? Math.PI / 2 : 0;

  const longM  = rotated ? heightM : widthM;
  const shortM = rotated ? widthM  : heightM;
  const marginM = Math.max(longM, shortM) * 0.08;  // 8% of longer side
  const extentLongM = longM + 2 * marginM, extentShortM = shortM + 2 * marginM;

  function uvToLonLat(u, v) {
    const x = u * Math.cos(-R) - v * Math.sin(-R);
    const y = u * Math.sin(-R) + v * Math.cos(-R);
    return [cLon + x / mLon, cLat - y / mLat];
  }
  function lonLatToUV(lon, lat) {
    const x = (lon - cLon) * mLon, y = -(lat - cLat) * mLat;
    return [x * Math.cos(R) - y * Math.sin(R), x * Math.sin(R) + y * Math.cos(R)];
  }

  return { R, rotated, cLon, cLat, mLon, mLat, uMid: 0, vMid: 0, longM, shortM, marginM,
           extentLongM, extentShortM, uvToLonLat, lonLatToUV };
}

// Legend-corner heuristic, redone in the ROTATED (u,v) frame so "emptiest
// corner" reflects the actual final image, not pre-rotation geography.
function bestLegendCornerUV(geom, rot) {
  const uvRingsOf = (g) => {
    const rings = g.type === 'Polygon' ? [g.coordinates] : g.coordinates;
    return rings.map(poly => poly.map(ring => ring.map(([lon, lat]) => rot.lonLatToUV(lon, lat))));
  };
  let uvPoly;
  try { uvPoly = { type: 'MultiPolygon', coordinates: uvRingsOf(geom) }; }
  catch (e) { return 'lr'; }

  const uHalf = rot.extentLongM / 2, vHalf = rot.extentShortM / 2;
  const quads = {
    ul: turf.bboxPolygon([rot.uMid - uHalf, rot.vMid - vHalf, rot.uMid, rot.vMid]),
    ur: turf.bboxPolygon([rot.uMid, rot.vMid - vHalf, rot.uMid + uHalf, rot.vMid]),
    ll: turf.bboxPolygon([rot.uMid - uHalf, rot.vMid, rot.uMid, rot.vMid + vHalf]),
    lr: turf.bboxPolygon([rot.uMid, rot.vMid, rot.uMid + uHalf, rot.vMid + vHalf]),
  };
  let best = 'lr', bestArea = Infinity;
  Object.keys(quads).forEach(k => {
    let area = 0;
    try { const inter = turf.intersect(uvPoly, quads[k]); if (inter) area = turf.area(inter); }
    catch (e) {}
    if (area < bestArea) { bestArea = area; best = k; }
  });
  return best;
}


async function captureFramedScreenshot(overlayFn, legendEntries, legendTitle, opts) {
  opts = opts || {};
  if (!plotPoly) return { blob: null, usedOsmFallback: false, noBasemap: true };
  const geom = plotPoly.geometry || plotPoly;
  const W = 1500, H = 1000;

  const rot = computePlotRotation(geom);
  const capW = rot.rotated ? H : W, capH = rot.rotated ? W : H;

  const bbox = turf.bbox(geom);
  const { mLon, mLat } = metersPerDegree((bbox[1] + bbox[3]) / 2);
  const marginM = Math.max(rot.longM, rot.shortM) * 0.08;
  const minLon = bbox[0] - marginM / mLon, maxLon = bbox[2] + marginM / mLon;
  const minLat = bbox[1] - marginM / mLat, maxLat = bbox[3] + marginM / mLat;
  const centerLat = (minLat + maxLat) / 2, centerLon = (minLon + maxLon) / 2;

  // Best zoom: largest integer zoom where expanded bbox fits within capW x capH
  let zoom = 1;
  for (let z = 20; z >= 1; z--) {
    const sc = 256 * Math.pow(2, z);
    const wx1 = ((minLon + 180) / 360) * sc, wx2 = ((maxLon + 180) / 360) * sc;
    const wy1 = (0.5 - Math.log((1 + Math.sin(maxLat*Math.PI/180)) / (1 - Math.sin(maxLat*Math.PI/180))) / (4*Math.PI)) * sc;
    const wy2 = (0.5 - Math.log((1 + Math.sin(minLat*Math.PI/180)) / (1 - Math.sin(minLat*Math.PI/180))) / (4*Math.PI)) * sc;
    if ((wx2 - wx1) <= capW && (wy2 - wy1) <= capH) { zoom = z; break; }
  }

  // Web Mercator projector
  const sc = 256 * Math.pow(2, zoom);
  const wMercY = lat => (0.5 - Math.log((1 + Math.sin(lat*Math.PI/180)) / (1 - Math.sin(lat*Math.PI/180))) / (4*Math.PI)) * sc;
  const wMercX = lon => ((lon + 180) / 360) * sc;
  const cX = wMercX(centerLon), cY = wMercY(centerLat);

  // Static Maps: max 640x640 CSS (scale=2 -> 1280x1280 actual px).
  // Request at capW/2 x capH/2 CSS (capped at 640), scale=2 returns double.
  // Image is then scaled to fill capW x capH — ~17% upscale at most,
  // invisible on satellite imagery. scaleX/Y correct vector coords for this.
  const cssW = Math.min(640, Math.round(capW / 2));
  const cssH = Math.min(640, Math.round(capH / 2));
  const imgW = cssW * 2, imgH = cssH * 2;
  const scaleX = capW / imgW, scaleY = capH / imgH;

  function project(lat, lon) {
    return {
      x: capW / 2 + (wMercX(lon) - cX) * scaleX,
      y: capH / 2 + (wMercY(lat) - cY) * scaleY,
    };
  }
  const fakeMap = { latLngToContainerPoint: ([lat, lon]) => project(lat, lon) };

  const interCanvas = document.createElement('canvas');
  interCanvas.width = capW; interCanvas.height = capH;
  const ictx = interCanvas.getContext('2d');
  ictx.fillStyle = '#dbe9d8'; ictx.fillRect(0, 0, capW, capH);

  // Fetch Google Satellite basemap
  let usedStaticMap = false;
  const apiKey = APP_CONFIG.mapsApiKey;
  if (!opts.noBasemap && apiKey) {
    try {
      const mapUrl = 'https://maps.googleapis.com/maps/api/staticmap'
        + '?center=' + centerLat + ',' + centerLon
        + '&zoom=' + zoom
        + '&size=' + cssW + 'x' + cssH
        + '&scale=2&maptype=satellite&key=' + apiKey;
      const resp = await fetch(mapUrl);
      if (resp.ok) {
        const imgBlob = await resp.blob();
        const img = await new Promise((res, rej) => {
          const el = new Image();
          const url = URL.createObjectURL(imgBlob);
          el.onload = () => { URL.revokeObjectURL(url); res(el); };
          el.onerror = rej;
          el.src = url;
        });
        ictx.drawImage(img, 0, 0, capW, capH);
        usedStaticMap = true;
      }
    } catch (e) { console.error('Static Maps fetch failed:', e.message); }
  }

  // Vector overlay
  try { overlayFn(ictx, fakeMap); } catch (e) { console.error('overlay error', e); }

  // Plot boundary (yellow)
  try {
    ictx.strokeStyle = '#ffe600'; ictx.lineWidth = 3;
    const polys = geom.type === 'Polygon' ? [geom.coordinates] : geom.coordinates;
    polys.forEach(rings => rings.forEach(ring => {
      ictx.beginPath();
      ring.forEach(([lon, lat], i) => {
        const pt = project(lat, lon);
        if (i === 0) ictx.moveTo(pt.x, pt.y); else ictx.lineTo(pt.x, pt.y);
      });
      ictx.closePath(); ictx.stroke();
    }));
  } catch (e) {}

  // Rotate combined image onto final canvas
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#dbe9d8'; ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.translate(W / 2, H / 2);
  ctx.rotate(rot.R);
  ctx.drawImage(interCanvas, -capW / 2, -capH / 2);
  ctx.restore();

  const corner = bestLegendCornerUV(geom, rot);
  if (legendEntries && legendEntries.length) drawLegendAtCorner(ctx, W, H, legendEntries, legendTitle, corner);
  drawNorthArrowAtCorner(ctx, W, H, OPPOSITE_CORNER[corner], rot.R);

  const blob = await canvasToBlobSafe(canvas);
  return { blob, usedOsmFallback: false, noBasemap: !usedStaticMap, usedStaticMap };
}


function hexToRgba(hex, a) {
  hex = hex.replace('#','');
  if (hex.length === 3) hex = hex.split('').map(c=>c+c).join('');
  const r = parseInt(hex.slice(0,2),16), g = parseInt(hex.slice(2,4),16), b = parseInt(hex.slice(4,6),16);
  return `rgba(${r},${g},${b},${a})`;
}

function drawPlantationOverlay(ctx, mapRef, blocksData) {
  (blocksData || blocks).forEach(b => {
    ctx.fillStyle = b.color; ctx.strokeStyle = '#000'; ctx.lineWidth = 0.5;
    b.points.forEach(p => {
      try {
        const pt = mapRef.latLngToContainerPoint([p.lat, p.lon]);
        ctx.beginPath(); ctx.arc(pt.x, pt.y, 3, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      } catch (e) {}
    });
  });
}

function buildShpShx(shapeType, records) {
  // shapeType: 1 = Point, 5 = Polygon
  const recBlocks = [];   // {contentBytes: Uint8Array, contentWords: int}
  let allXY = [];

  records.forEach(rec => {
    if (shapeType === 1) {
      const buf = new ArrayBuffer(4 + 16);
      const dv  = new DataView(buf);
      dv.setInt32(0, 1, true);
      dv.setFloat64(4, rec.x, true);
      dv.setFloat64(12, rec.y, true);
      allXY.push([rec.x, rec.y]);
      recBlocks.push({ bytes: new Uint8Array(buf), words: buf.byteLength / 2 });
    } else {
      // Polygon — possibly multi-part (MultiPolygon as parts)
      const parts = rec.parts;                       // array of rings, each ring = [[x,y],...]
      let numPoints = 0;
      parts.forEach(r => numPoints += r.length);
      const partXY = [];
      parts.forEach(r => r.forEach(p => partXY.push(p)));
      allXY = allXY.concat(partXY);
      const bbox = shpBBox(partXY);

      const headerBytes = 4 + 32 + 4 + 4;                 // shapeType+box+numParts+numPoints
      const partsBytes   = parts.length * 4;
      const pointsBytes   = numPoints * 16;
      const total = headerBytes + partsBytes + pointsBytes;

      const buf = new ArrayBuffer(total);
      const dv  = new DataView(buf);
      let off = 0;
      dv.setInt32(off, 5, true); off += 4;
      dv.setFloat64(off, bbox[0], true); off += 8;
      dv.setFloat64(off, bbox[1], true); off += 8;
      dv.setFloat64(off, bbox[2], true); off += 8;
      dv.setFloat64(off, bbox[3], true); off += 8;
      dv.setInt32(off, parts.length, true); off += 4;
      dv.setInt32(off, numPoints, true);   off += 4;
      let runningIdx = 0;
      parts.forEach(r => { dv.setInt32(off, runningIdx, true); off += 4; runningIdx += r.length; });
      parts.forEach(r => r.forEach(([x,y]) => {
        dv.setFloat64(off, x, true); off += 8;
        dv.setFloat64(off, y, true); off += 8;
      }));
      recBlocks.push({ bytes: new Uint8Array(buf), words: buf.byteLength / 2 });
    }
  });

  const fileBBox = allXY.length ? shpBBox(allXY) : [0,0,0,0];

  // ── .shp ──────────────────────────────────────────────────────────────
  let shpLenWords = 50;   // header = 100 bytes = 50 words
  recBlocks.forEach(rb => shpLenWords += 4 + rb.words);    // 8-byte record header = 4 words
  const shpBuf = new ArrayBuffer(shpLenWords * 2);
  const shpDv  = new DataView(shpBuf);
  shpDv.setInt32(0, 9994, false);
  for (let i = 4; i <= 20; i += 4) shpDv.setInt32(i, 0, false);
  shpDv.setInt32(24, shpLenWords, false);
  shpDv.setInt32(28, 1000, true);
  shpDv.setInt32(32, shapeType, true);
  shpDv.setFloat64(36, fileBBox[0], true);
  shpDv.setFloat64(44, fileBBox[1], true);
  shpDv.setFloat64(52, fileBBox[2], true);
  shpDv.setFloat64(60, fileBBox[3], true);
  shpDv.setFloat64(68, 0, true); shpDv.setFloat64(76, 0, true);
  shpDv.setFloat64(84, 0, true); shpDv.setFloat64(92, 0, true);

  // ── .shx ──────────────────────────────────────────────────────────────
  const shxLenWords = 50 + recBlocks.length * 4;
  const shxBuf = new ArrayBuffer(shxLenWords * 2);
  const shxDv  = new DataView(shxBuf);
  shxDv.setInt32(0, 9994, false);
  for (let i = 4; i <= 20; i += 4) shxDv.setInt32(i, 0, false);
  shxDv.setInt32(24, shxLenWords, false);
  shxDv.setInt32(28, 1000, true);
  shxDv.setInt32(32, shapeType, true);
  shxDv.setFloat64(36, fileBBox[0], true);
  shxDv.setFloat64(44, fileBBox[1], true);
  shxDv.setFloat64(52, fileBBox[2], true);
  shxDv.setFloat64(60, fileBBox[3], true);
  shxDv.setFloat64(68, 0, true); shxDv.setFloat64(76, 0, true);
  shxDv.setFloat64(84, 0, true); shxDv.setFloat64(92, 0, true);

  let shpOff = 50;     // words, start of first record (after 100-byte header)
  let shxOff = 100;    // bytes, start of first index entry
  const shpBytes = new Uint8Array(shpBuf);
  let shpByteCursor = 100;

  recBlocks.forEach((rb, i) => {
    // record header (8 bytes): record number (1-based, BE), content length in words (BE)
    const rh = new DataView(new ArrayBuffer(8));
    rh.setInt32(0, i + 1, false);
    rh.setInt32(4, rb.words, false);
    shpBytes.set(new Uint8Array(rh.buffer), shpByteCursor);
    shpByteCursor += 8;
    shpBytes.set(rb.bytes, shpByteCursor);
    shpByteCursor += rb.bytes.length;

    shxDv.setInt32(shxOff, shpOff, false);
    shxDv.setInt32(shxOff + 4, rb.words, false);
    shxOff += 8;
    shpOff += 4 + rb.words;
  });

  return { shp: shpBytes, shx: new Uint8Array(shxBuf) };
}

// fields: [{name, type:'C'|'N', length, decimals}]; records: [{name: value, ...}]
function buildDbf(fields, records) {
  const headerLen = 32 + fields.length * 32 + 1;
  const recLen = 1 + fields.reduce((s,f) => s + f.length, 0);
  const totalLen = headerLen + recLen * records.length + 1;   // +1 EOF marker

  const buf = new ArrayBuffer(totalLen);
  const dv  = new DataView(buf);
  const u8  = new Uint8Array(buf);

  dv.setUint8(0, 0x03);
  dv.setUint8(1, 26); dv.setUint8(2, 1); dv.setUint8(3, 1);   // dummy date
  dv.setInt32(4, records.length, true);
  dv.setInt16(8, headerLen, true);
  dv.setInt16(10, recLen, true);

  let off = 32;
  fields.forEach(f => {
    const nameBytes = new TextEncoder().encode(f.name.slice(0,10));
    for (let i = 0; i < 11; i++) u8[off+i] = i < nameBytes.length ? nameBytes[i] : 0;
    dv.setUint8(off+11, f.type.charCodeAt(0));
    dv.setUint8(off+16, f.length);
    dv.setUint8(off+17, f.decimals || 0);
    off += 32;
  });
  u8[off] = 0x0D; off += 1;   // header terminator

  records.forEach(rec => {
    u8[off] = 0x20; off += 1;   // not-deleted flag
    fields.forEach(f => {
      let val = rec[f.name];
      let str;
      if (f.type === 'N') {
        const num = (typeof val === 'number') ? val : parseFloat(val) || 0;
        str = num.toFixed(f.decimals || 0);
        str = str.length > f.length ? str.slice(0, f.length) : str.padStart(f.length, ' ');
      } else {
        str = (val === undefined || val === null) ? '' : String(val);
        str = str.length > f.length ? str.slice(0, f.length) : str.padEnd(f.length, ' ');
      }
      const bytes = new TextEncoder().encode(str).slice(0, f.length);
      for (let i = 0; i < f.length; i++) u8[off+i] = i < bytes.length ? bytes[i] : 0x20;
      off += f.length;
    });
  });
  u8[off] = 0x1A;   // EOF marker

  return u8;
}

// Convenience: build a full {shp,shx,dbf,prj} set for one layer
function buildShapefileSet(shapeType, geoRecords, fields, dbfRecords) {
  const { shp, shx } = buildShpShx(shapeType, geoRecords);
  const dbf = buildDbf(fields, dbfRecords);
  return { shp, shx, dbf, prj: WGS84_PRJ };
}


// ═══════════════════════════════════════════════════════════════════════
// COMBINED EXPORT TASK
// One button → one ZIP containing both KMLs, both JPG screenshots, and
// three shapefile layers (species polygons, sapling points, soil polygons).
// Each step is wrapped so a single failure (e.g. tainted-canvas screenshot)
// does not abort the rest of the export.
// ═══════════════════════════════════════════════════════════════════════
async function exportAllTask() {
  if (!blocks.length) { setStatus(Lang.s_no_export || 'Nothing to export.', 'warn'); return; }

  const { groups: soilGroups, skipped: soilSkipped } = computeSoilGroups();
  const speciesCounts = {};
  blocks.forEach(b => { speciesCounts[b.species] = (speciesCounts[b.species]||0) + b.points.length; });
  const plantLegend = Object.entries(
    blocks.reduce((a,b)=>{ a[b.species]=b.color; return a; }, {})
  ).map(([sp,c]) => {
    const commonName = sp.match(/\(([^)]+)\)/)?.[1] || sp;
    return { color:c, label: `${commonName} (${speciesCounts[sp]||0})` };
  });

  const screenshots = [{
    name: `${kmlBaseName}_plantationMap.jpg`,
    overlayFn: (ctx, mapRef) => drawPlantationOverlay(ctx, mapRef),
    legendEntries: plantLegend, legendTitle: Lang.th_species,
  }];
  if (soilGroups.length) {
    screenshots.push({
      name: `${kmlBaseName}_soilMap.jpg`,
      overlayFn: (ctx, mapRef) => drawSoilGroupOverlay(ctx, mapRef, soilGroups),
      legendEntries: soilGroups.map(g => ({ color: g.color, label: `${g.soilClass} (${(g.areaSqm/10000).toFixed(2)} ha)` })),
      legendTitle: Lang.th_soiltype,
    });
  }

  const geoRecsSp = [], dbfRecsSp = [];
  blocks.forEach(b => {
    if (!b.geom) return;
    const g = b.geom.geometry || b.geom;
    const parts = g.type === 'Polygon' ? [g.coordinates[0]] : g.coordinates.map(p => p[0]);
    geoRecsSp.push({ parts: parts.map(ring => ring.map(([lon,lat]) => [lon,lat])) });
    dbfRecsSp.push({ speciesNm: b.species.slice(0,80), spColor: b.color, areaSqm: b.areaSqm, saplCount: b.points.length });
  });

  const geoRecsPts = [], dbfRecsPts = [];
  blocks.forEach(b => b.points.forEach(p => {
    geoRecsPts.push({ x: p.lon, y: p.lat });
    dbfRecsPts.push({ speciesNm: b.species.slice(0,80), spColor: b.color });
  }));

  const geoRecsSoil = [], dbfRecsSoil = [];
  soilGroups.forEach(g => {
    const geom = g.geom;
    const parts = geom.type === 'Polygon' ? [geom.coordinates[0]] : geom.coordinates.map(p => p[0]);
    geoRecsSoil.push({ parts: parts.map(ring => ring.map(([lon,lat]) => [lon,lat])) });
    dbfRecsSoil.push({ soilClass: g.soilClass.slice(0,40), soilColor: g.color, areaSqm: g.areaSqm });
  });

  const skipNote = soilSkipped > 0 ? `  (${soilSkipped} blocks have no soil mapping)` : '';

  const _d2 = new Date();
  const _p2 = n => String(n).padStart(2,'0');
  const ts = _d2.getFullYear()+_p2(_d2.getMonth()+1)+_p2(_d2.getDate())+'_'+_p2(_d2.getHours())+_p2(_d2.getMinutes())+_p2(_d2.getSeconds());
  const shpLayersSp   = { name: `${kmlBaseName}_species_polygons`, shapeType: 5, geoRecords: geoRecsSp,
    fields: [{ name:'speciesNm',type:'C',length:80 },{ name:'spColor',type:'C',length:10 },
             { name:'areaSqm',type:'N',length:12,decimals:2 },{ name:'saplCount',type:'N',length:10,decimals:0 }],
    dbfRecords: dbfRecsSp };
  const shpLayersPts  = { name: `${kmlBaseName}_sapling_points`,  shapeType: 1, geoRecords: geoRecsPts,
    fields: [{ name:'speciesNm',type:'C',length:80 },{ name:'spColor',type:'C',length:10 }],
    dbfRecords: dbfRecsPts };
  const shpLayersSoil = { name: `${kmlBaseName}_plantedSoilMap`,  shapeType: 5, geoRecords: geoRecsSoil,
    fields: [{ name:'soilClass',type:'C',length:40 },{ name:'soilColor',type:'C',length:10 },
             { name:'areaSqm',type:'N',length:12,decimals:2 }],
    dbfRecords: dbfRecsSoil };

  // Capture JPGs ONCE — reused for both local ZIP and Drive uploads.
  setStatus(Lang.s_exporting || 'Building export…', '');
  // Capture JPGs — defer if Maps API unavailable (no network for satellite)
  const plantJpgResult = await captureFramedScreenshot(
    (ctx, m) => drawPlantationOverlay(ctx, m), plantLegend, Lang.th_species);
  const soilLegEntries = soilGroups.map(g => ({ color:g.color, label:`${g.soilClass} (${(g.areaSqm/10000).toFixed(2)} ha)` }));
  const soilJpgResult = soilGroups.length
    ? await captureFramedScreenshot(
        (ctx, m) => drawSoilGroupOverlay(ctx, m, soilGroups), soilLegEntries, Lang.th_soiltype)
    : { blob: null, usedStaticMap: true };
  const plantJpgBlob = plantJpgResult.usedStaticMap ? plantJpgResult.blob : null;
  const soilJpgBlob  = soilJpgResult.usedStaticMap  ? soilJpgResult.blob  : null;
  if (!plantJpgResult.usedStaticMap || (!soilJpgResult.usedStaticMap && soilGroups.length)) {
    deferPlantJpgs(
      `${kmlBaseName}_plantationMap_${ts}.jpg`,
      soilGroups.length ? `${kmlBaseName}_plantedSoilMap_${ts}.jpg` : null,
      ts, APP_CONFIG.toolFolders.plant || 'PlantationMapper',
      plantLegend, soilLegEntries, soilGroups);
  }

  // Build local combined ZIP directly (no double-capture via runExportZip)
  const localZip = new JSZip();
  if (plantJpgBlob) localZip.file(`${kmlBaseName}_plantationMap.jpg`, plantJpgBlob);
  if (soilJpgBlob)  localZip.file(`${kmlBaseName}_plantedSoilMap.jpg`, soilJpgBlob);
  [shpLayersSp, shpLayersPts, shpLayersSoil].forEach(layer => {
    if (!layer.geoRecords.length) return;
    try {
      const set = buildShapefileSet(layer.shapeType, layer.geoRecords, layer.fields, layer.dbfRecords);
      const folder = localZip.folder('shapefiles');
      folder.file(layer.name + '.shp', set.shp);
      folder.file(layer.name + '.shx', set.shx);
      folder.file(layer.name + '.dbf', set.dbf);
      folder.file(layer.name + '.prj', set.prj);
    } catch(e) { console.error('SHP build error:', layer.name, e); }
  });
  const localZipBlob = await localZip.generateAsync({ type: 'blob' });
  // local copy goes to OPFS /sent/ — no browser download dialog for plantation
  setStatus((Lang.s_export_done ? Lang.s_export_done() : 'Export ready.') + skipNote, '');

  // Individual SHP ZIPs + JPGs for Drive (background)
  const [zipSp, zipPts, zipSoil] = await Promise.all([
    buildShpZip(shpLayersSp),
    buildShpZip(shpLayersPts),
    geoRecsSoil.length ? buildShpZip(shpLayersSoil) : Promise.resolve(null),
  ]);
  const plantFolder = APP_CONFIG.toolFolders.plant || 'PlantationMapper';
  if (zipSp)        await opfsSaveToSent(plantFolder, `${kmlBaseName}_species_polygons_${ts}.zip`,  zipSp);
  if (zipPts)       await opfsSaveToSent(plantFolder, `${kmlBaseName}_sapling_points_${ts}.zip`,    zipPts);
  if (zipSoil)      await opfsSaveToSent(plantFolder, `${kmlBaseName}_plantedSoilMap_${ts}.zip`,    zipSoil);
  if (plantJpgBlob) await opfsSaveToSent(plantFolder, `${kmlBaseName}_plantationMap_${ts}.jpg`,     plantJpgBlob);
  if (soilJpgBlob)  await opfsSaveToSent(plantFolder, `${kmlBaseName}_plantedSoilMap_${ts}.jpg`,    soilJpgBlob);
  await opfsSaveGeoJSON(plantFolder, `${kmlBaseName}_species_polygons_${ts}.geojson`, buildSpeciesPolygonsGeoJSON());
  try {
    const spKml = new Blob([geojsonToKML(buildSpeciesPolygonsGeoJSON(),`${kmlBaseName}_species_polygons_${ts}`)],{type:'application/vnd.google-earth.kml+xml'});
    await opfsSaveToSent(plantFolder, `${kmlBaseName}_species_polygons_${ts}.kml`, spKml);
  } catch(e) {}
  await opfsSaveGeoJSON(plantFolder, `${kmlBaseName}_sapling_points_${ts}.geojson`,  buildSaplingPointsGeoJSON());
  if (soilGroups.length) await opfsSaveGeoJSON(plantFolder, `${kmlBaseName}_plantedSoilMap_${ts}.geojson`, buildPlantSoilGeoJSON(soilGroups));
  const driveFiles = [];
  if (zipSp)        driveFiles.push({ filename:`${kmlBaseName}_species_polygons_${ts}.zip`, blob:zipSp });
  if (zipPts)       driveFiles.push({ filename:`${kmlBaseName}_sapling_points_${ts}.zip`,   blob:zipPts });
  if (zipSoil)      driveFiles.push({ filename:`${kmlBaseName}_plantedSoilMap_${ts}.zip`,   blob:zipSoil });
  if (plantJpgBlob) driveFiles.push({ filename:`${kmlBaseName}_plantationMap_${ts}.jpg`,    blob:plantJpgBlob });
  if (soilJpgBlob)  driveFiles.push({ filename:`${kmlBaseName}_plantedSoilMap_${ts}.jpg`,   blob:soilJpgBlob  });
  if (driveFiles.length) uploadAllFiles(driveFiles, plantFolder);
  exportDone = true;
}

function tsSuffix() {
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  // Use local time (not UTC) so filenames match the field worker's clock
  return '_'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes());
}

// ── Legacy Plot Sync ──────────────────────────────────────────────────
// Fetches GeoJSONs from ARRmapper/VectorTool/_legacy/ in Drive and
// writes them to OPFS /geojson/VectorTool/_legacy/ on the device.
// Only downloads files not already present (diff by filename).

const LEGACY_OPFS_PATH = ['geojson', 'VectorTool', '_legacy'];

async function syncLegacyPlots() {
  const btn    = document.getElementById('btn-sync-legacy');
  const status = document.getElementById('legacy-sync-status');

  if (!SESSION.setupDone || !SESSION.projectKey) {
    status.textContent = '⚠️ Sign in first.';
    status.style.color = '#fbbf24';
    return;
  }
  const scriptUrl = APP_CONFIG.projects[SESSION.projectKey]?.scriptUrl;
  if (!scriptUrl || scriptUrl.startsWith('PLACEHOLDER')) {
    status.textContent = '⚠️ No script URL for this project.';
    status.style.color = '#f87171';
    return;
  }

  btn.disabled = true;
  status.style.color = '#9ca3af';
  status.textContent = 'Checking Drive…';

  try {
    // 1. Get list of files available in Drive _legacy/
    const listResp = await fetch(scriptUrl + '?action=listLegacy');
    const listData = await listResp.json();
    if (!listData.ok) throw new Error(listData.error || 'listLegacy failed');

    const driveFiles = listData.files; // array of filenames

    // 2. Get list of files already in OPFS _legacy/
    const legacyDir  = await opfsDir(LEGACY_OPFS_PATH, true);
    const localFiles = new Set(await opfsList(legacyDir));

    const toFetch = driveFiles.filter(f => !localFiles.has(f));

    if (toFetch.length === 0) {
      status.textContent = `✅ Already up to date (${driveFiles.length} plots).`;
      status.style.color = '#6ee7b7';
      btn.disabled = false;
      return;
    }

    status.textContent = `Downloading ${toFetch.length} new plots…`;

    // 3. Fetch each missing file sequentially (avoid hammering Apps Script)
    let done = 0, failed = 0;
    for (const fname of toFetch) {
      try {
        const resp = await fetch(scriptUrl + '?action=getLegacyFile&name=' + encodeURIComponent(fname));
        const data = await resp.json();
        if (!data.ok) throw new Error(data.error);
        const blob = new Blob([data.content], { type: 'application/geo+json' });
        await opfsWrite(legacyDir, fname, blob);
        done++;
        status.textContent = `Downloading… ${done}/${toFetch.length}`;
      } catch (e) {
        console.warn('Legacy fetch failed:', fname, e.message);
        failed++;
      }
    }

    const total = (await opfsList(legacyDir)).length;
    status.textContent = `✅ Synced ${done} new plots${failed ? ` (${failed} failed)` : ''} — ${total} total on device.`;
    status.style.color = failed ? '#fbbf24' : '#6ee7b7';

      
  } catch (e) {
    status.textContent = '❌ Sync failed: ' + e.message;
    status.style.color = '#f87171';
    console.error('syncLegacyPlots:', e);
  }

  btn.disabled = false;
}

// ── fixPolygonGeometry — QGIS "Fix Geometries / Structure" equivalent ──────
// Approximates GEOSMakeValid(STRUCTURE): deduplicates vertices, fixes winding,
// unkinks self-intersections, simplifies spikes/collinear edges, takes largest
// valid fragment. Applied to ALL polygon paths before export or placement.
function fixPolygonGeometry(coords) {
  // coords = [[lon,lat],...] — may be open or closed ring
  try {
    // Step 0: close ring
    let ring = [...coords];
    if (ring[0][0] !== ring[ring.length-1][0] || ring[0][1] !== ring[ring.length-1][1])
      ring.push(ring[0]);

    // Step 1: remove duplicate consecutive vertices (degenerate edges)
    ring = ring.filter((pt, i) => {
      if (i === 0) return true;
      return !(Math.abs(pt[0]-ring[i-1][0]) < 1e-10 && Math.abs(pt[1]-ring[i-1][1]) < 1e-10);
    });

    // Need at least 4 points (3 unique + closing) for a valid polygon
    if (ring.length < 4) return coords;

    // Step 2: build turf feature
    let feat;
    try { feat = turf.polygon([ring]); }
    catch(e) { return coords; }

    // Step 3: fix winding order (CCW exterior ring)
    try { feat = turf.rewind(feat, { reverse: false, mutate: false }); } catch(e) {}

    // Step 4: unkink — split at self-intersections, take largest fragment
    // (equivalent to GEOSMakeValid Structure noding + polygon building)
    try {
      const unkinked = turf.unkinkPolygon(feat);
      if (unkinked && unkinked.features && unkinked.features.length > 0) {
        feat = unkinked.features.reduce((a, b) => turf.area(a) >= turf.area(b) ? a : b);
      }
    } catch(e) {}

    // Step 5: simplify — removes spikes and collinear vertices
    // tolerance 0.00001° ≈ 1m at equator — tight enough to preserve shape
    try { feat = turf.simplify(feat, { tolerance: 0.000005, highQuality: true }); } catch(e) {}

    // Return fixed ring
    const fixed = feat.geometry.coordinates[0];
    return fixed.length >= 4 ? fixed : coords;

  } catch(e) {
    return coords; // fallback: return original coords unchanged
  }
}

function computeSoilGroups() {
  const groups = {};   // soilClass -> { color, geoms:[turf geom], areaSqm }
  let skipped = 0;
  blocks.forEach(b => {
    const cls = SOIL_CLASS_DICT[b.species];
    if (!cls) { skipped++; return; }
    if (!groups[cls]) groups[cls] = { color: SOIL_COLOR_DICT[cls] || '#999999', geoms: [] };
    if (b.geom) groups[cls].geoms.push(b.geom.geometry || b.geom);
  });
  const result = [];
  Object.entries(groups).forEach(([cls, g]) => {
    let merged = g.geoms[0];
    for (let i = 1; i < g.geoms.length; i++) {
      try { merged = turf.union(merged, g.geoms[i]) || merged; } catch(e) {}
    }
    if (merged) {
      const fc = merged.geometry ? merged : turf.feature(merged);
      result.push({
        soilClass: cls,
        color: g.color,
        geom: fc.geometry || fc,
        areaSqm: Math.round(turf.area(fc)),
      });
    }
  });
  return { groups: result, skipped };
}

async function captureFramedScreenshot(overlayFn, legendEntries, legendTitle, opts) {
  opts = opts || {};
  if (!plotPoly) return { blob: null, usedOsmFallback: false, noBasemap: true };
  const geom = plotPoly.geometry || plotPoly;
  const W = 1500, H = 1000;

  const rot = computePlotRotation(geom);
  const capW = rot.rotated ? H : W, capH = rot.rotated ? W : H;

  const bbox = turf.bbox(geom);
  const { mLon, mLat } = metersPerDegree((bbox[1] + bbox[3]) / 2);
  const marginM = Math.max(rot.longM, rot.shortM) * 0.08;
  const minLon = bbox[0] - marginM / mLon, maxLon = bbox[2] + marginM / mLon;
  const minLat = bbox[1] - marginM / mLat, maxLat = bbox[3] + marginM / mLat;
  const centerLat = (minLat + maxLat) / 2, centerLon = (minLon + maxLon) / 2;

  // Best zoom: largest integer zoom where expanded bbox fits within capW x capH
  let zoom = 1;
  for (let z = 20; z >= 1; z--) {
    const sc = 256 * Math.pow(2, z);
    const wx1 = ((minLon + 180) / 360) * sc, wx2 = ((maxLon + 180) / 360) * sc;
    const wy1 = (0.5 - Math.log((1 + Math.sin(maxLat*Math.PI/180)) / (1 - Math.sin(maxLat*Math.PI/180))) / (4*Math.PI)) * sc;
    const wy2 = (0.5 - Math.log((1 + Math.sin(minLat*Math.PI/180)) / (1 - Math.sin(minLat*Math.PI/180))) / (4*Math.PI)) * sc;
    if ((wx2 - wx1) <= capW && (wy2 - wy1) <= capH) { zoom = z; break; }
  }

  // Web Mercator projector
  const sc = 256 * Math.pow(2, zoom);
  const wMercY = lat => (0.5 - Math.log((1 + Math.sin(lat*Math.PI/180)) / (1 - Math.sin(lat*Math.PI/180))) / (4*Math.PI)) * sc;
  const wMercX = lon => ((lon + 180) / 360) * sc;
  const cX = wMercX(centerLon), cY = wMercY(centerLat);

  // Static Maps: max 640x640 CSS (scale=2 -> 1280x1280 actual px).
  // Request at capW/2 x capH/2 CSS (capped at 640), scale=2 returns double.
  // Image is then scaled to fill capW x capH — ~17% upscale at most,
  // invisible on satellite imagery. scaleX/Y correct vector coords for this.
  const cssW = Math.min(640, Math.round(capW / 2));
  const cssH = Math.min(640, Math.round(capH / 2));
  const imgW = cssW * 2, imgH = cssH * 2;
  const scaleX = capW / imgW, scaleY = capH / imgH;

  function project(lat, lon) {
    return {
      x: capW / 2 + (wMercX(lon) - cX) * scaleX,
      y: capH / 2 + (wMercY(lat) - cY) * scaleY,
    };
  }
  const fakeMap = { latLngToContainerPoint: ([lat, lon]) => project(lat, lon) };

  const interCanvas = document.createElement('canvas');
  interCanvas.width = capW; interCanvas.height = capH;
  const ictx = interCanvas.getContext('2d');
  ictx.fillStyle = '#dbe9d8'; ictx.fillRect(0, 0, capW, capH);

  // Fetch Google Satellite basemap
  let usedStaticMap = false;
  const apiKey = APP_CONFIG.mapsApiKey;
  if (!opts.noBasemap && apiKey) {
    try {
      const mapUrl = 'https://maps.googleapis.com/maps/api/staticmap'
        + '?center=' + centerLat + ',' + centerLon
        + '&zoom=' + zoom
        + '&size=' + cssW + 'x' + cssH
        + '&scale=2&maptype=satellite&key=' + apiKey;
      const resp = await fetch(mapUrl);
      if (resp.ok) {
        const imgBlob = await resp.blob();
        const img = await new Promise((res, rej) => {
          const el = new Image();
          const url = URL.createObjectURL(imgBlob);
          el.onload = () => { URL.revokeObjectURL(url); res(el); };
          el.onerror = rej;
          el.src = url;
        });
        ictx.drawImage(img, 0, 0, capW, capH);
        usedStaticMap = true;
      }
    } catch (e) { console.error('Static Maps fetch failed:', e.message); }
  }

  // Vector overlay
  try { overlayFn(ictx, fakeMap); } catch (e) { console.error('overlay error', e); }

  // Plot boundary (yellow)
  try {
    ictx.strokeStyle = '#ffe600'; ictx.lineWidth = 3;
    const polys = geom.type === 'Polygon' ? [geom.coordinates] : geom.coordinates;
    polys.forEach(rings => rings.forEach(ring => {
      ictx.beginPath();
      ring.forEach(([lon, lat], i) => {
        const pt = project(lat, lon);
        if (i === 0) ictx.moveTo(pt.x, pt.y); else ictx.lineTo(pt.x, pt.y);
      });
      ictx.closePath(); ictx.stroke();
    }));
  } catch (e) {}

  // Rotate combined image onto final canvas
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#dbe9d8'; ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.translate(W / 2, H / 2);
  ctx.rotate(rot.R);
  ctx.drawImage(interCanvas, -capW / 2, -capH / 2);
  ctx.restore();

  const corner = bestLegendCornerUV(geom, rot);
  if (legendEntries && legendEntries.length) drawLegendAtCorner(ctx, W, H, legendEntries, legendTitle, corner);
  drawNorthArrowAtCorner(ctx, W, H, OPPOSITE_CORNER[corner], rot.R);

  const blob = await canvasToBlobSafe(canvas);
  return { blob, usedOsmFallback: false, noBasemap: !usedStaticMap, usedStaticMap };
}
